<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>꽃잎 볼링·컬링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 신나는 유치원 체육 시간, 크고 단순한 말
   IDEA: 장난감 같은 3D 볼링장과 눈 내린 컬링장
   PICTURE: 게임 화면 자체가 그림, 위에 점수판 한 줄
   COLOUR and TYPE: 사탕 분홍 #ff5fa2, 하늘 #3fb6ff, 노랑 #ffd23f / Jua
   LAYOUT: 전체 화면 3D + 위 점수판 + 가운데 큰 말풍선 + 아래 안내 */
:root{color-scheme:light;--pink:#ff5fa2;--sky:#3fb6ff;--sun:#ffd23f;--ink:#2b1640}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1850;color:var(--ink);font-family:Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0}#stage canvas{display:block}
button{font:inherit;cursor:pointer}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:#fffdf6;border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#gname{font-size:22px;color:var(--pink)}
#board{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.fr{width:46px;text-align:center;border-radius:10px;background:#f3eaff;padding:2px 0}
.fr small{display:block;font-size:13px;color:#8a6fb0}.fr b{font-size:18px;display:block;min-height:24px}
.fr.on{background:var(--sun)}
.dot{width:22px;height:22px;border-radius:50%;background:#d9d2e6;border:3px solid #fff}
.dot.p{background:var(--pink)}.dot.b{background:var(--sky)}.dot.used{opacity:.35}
.tot{font-size:20px;margin-left:6px}
#menuBtn{border:0;border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink);font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.18);min-height:44px}
.msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-size:clamp(40px,9vw,88px);color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--pink);white-space:nowrap;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .25s}
.msg.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#lanesUI{position:fixed;inset:0;pointer-events:none}.laneui{position:absolute;top:0;bottom:0}
.split .laneui+.laneui{border-left:5px solid #fff}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;font-size:clamp(26px,3.8vw,44px);line-height:1.25;background:#FAC775;color:#26215C;border:4px solid #fff;border-radius:22px;padding:10px 22px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.hint:empty{display:none}
.split .msg{font-size:clamp(30px,5.5vw,64px)}.split .hint{font-size:clamp(20px,2.8vw,34px);max-width:80%}
.split #camBox{left:50%;transform:translateX(-50%);bottom:12px}
.pn.p{color:#d63a7f}.pn.b{color:#1f8fe0}
#camBox{position:fixed;left:10px;bottom:70px;width:160px;border-radius:14px;overflow:hidden;border:4px solid #fff;background:#000;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#camBox video{width:100%;display:block;transform:scaleX(-1)}
#camSt{background:#fff;font-size:14px;padding:4px 6px;text-align:center;line-height:1.3}#camSt.ok{background:#5ee08a}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:radial-gradient(circle at 30% 20%,#ffe3f0,#d9f0ff 60%,#fff6d6)}
.screen h1{margin:0;font-size:clamp(34px,6vw,52px);line-height:1.05;color:var(--pink);text-shadow:0 4px 0 #fff}
.screen h2{margin:0;font-size:clamp(34px,6vw,52px);color:var(--pink)}
.screen p{margin:0;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:18px}
.card{border:0;border-radius:26px;padding:18px 12px 16px;background:#fff;box-shadow:0 8px 0 rgba(43,22,64,.15);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);transition:transform .15s}
.card:active{transform:translateY(4px)}
.card svg{width:120px;height:120px}.card b{font-size:30px}.card span{font-size:16px;color:#7a6496}
.card.bowl b{color:var(--pink)}.card.curl b{color:#1f8fe0}
.camopt{font-size:19px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 16px;min-height:44px}
.camopt input{width:24px;height:24px;accent-color:var(--pink)}
.small{font-size:15px!important;color:#7a6496;max-width:520px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{border:0;border-radius:18px;padding:14px 26px;font-size:22px;min-height:52px;background:var(--pink);color:#fff;box-shadow:0 5px 0 #c23a78}
.big.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.15)}
[hidden]{display:none!important}
.cards.three{grid-template-columns:repeat(3,minmax(0,200px))}
.card.m b{font-size:32px}.card.m.solo b{color:var(--pink)}.card.m.duo b{color:#1f8fe0}.card.m.tour b{color:#e08a00}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;width:min(900px,100%)}
.ngrid div{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:6px 10px}
.ngrid span{font-size:18px;color:#8a6fb0;min-width:1.4em}
.ngrid input{flex:1;font:inherit;font-size:20px;border:3px solid #f3d3e4;border-radius:10px;padding:6px 8px;min-height:44px;width:100%}
.ngrid.one{grid-template-columns:minmax(0,320px);justify-content:center}.ngrid.two{grid-template-columns:repeat(2,minmax(0,300px));justify-content:center}
.cgrid{display:grid;grid-template-columns:repeat(5,64px);gap:10px}
.cgrid button{border:0;border-radius:16px;background:#fff;font-size:28px;min-height:64px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.cgrid small{font-size:14px}
.br{display:flex;gap:14px;overflow-x:auto;max-width:100%;padding:8px;background:#ffffffaa;border-radius:20px}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:8px;min-width:130px}
.col h3{margin:0;font-size:16px;color:#8a6fb0;font-weight:400}
.mt{background:#fff;border-radius:12px;padding:4px 8px;font-size:17px;text-align:left;border:3px solid transparent}
.mt.now{border-color:var(--sun)}.sl{display:flex;justify-content:space-between;gap:8px}.sl.win{color:#d63a7f}.sl.lose{opacity:.4}
.prow{display:flex;align-items:center;gap:5px;padding:2px 6px;border-radius:12px}.prow.on{background:#fff4c2}
.pn{font-size:18px;min-width:3.5em}
#board{flex-direction:column;align-items:stretch}
@media(max-width:600px){.cards.three{grid-template-columns:repeat(3,minmax(0,1fr))}.ngrid.two{grid-template-columns:minmax(0,1fr)}.cgrid{grid-template-columns:repeat(5,52px)}.pn{font-size:15px}}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card svg{width:84px;height:84px}.card b{font-size:24px}.fr{width:36px}.fr b{font-size:15px}#camBox{width:110px}#gname{display:none}}
@media(prefers-reduced-motion:reduce){.msg{transition:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head><body>
<div id="stage"></div>
<header id="hud" hidden><div class="pill" id="gname">볼링</div><div class="pill" id="board"></div><button id="menuBtn">처음으로</button></header>
<div id="lanesUI"></div>
<div id="camBox" hidden><video id="vid" playsinline muted></video><div id="camSt">카메라 준비 중…</div></div>

<section id="menu" class="screen">
  <h1>꽃잎반 3D 스포츠</h1>
  <p>무엇을 해 볼까요?</p>
  <div class="cards">
    <button class="card bowl" data-g="bowl"><svg viewBox="0 0 120 120"><ellipse cx="60" cy="108" rx="40" ry="7" fill="#e7dcf5"/><path d="M48 104c-6-18-4-30 2-40 4-7 3-14 2-20-1-9 3-16 8-16s9 7 8 16c-1 6-2 13 2 20 6 10 8 22 2 40z" fill="#fff" stroke="#d8cbe8" stroke-width="2"/><rect x="51" y="50" width="18" height="4" rx="2" fill="#ff3d7f"/><rect x="50" y="57" width="20" height="4" rx="2" fill="#ff3d7f"/><circle cx="34" cy="90" r="18" fill="#ff5fa2"/><circle cx="29" cy="84" r="3" fill="#7a1f4c"/><circle cx="37" cy="82" r="3" fill="#7a1f4c"/><circle cx="34" cy="91" r="3" fill="#7a1f4c"/></svg><b>볼링</b><span>핀을 와르르!</span></button>
    <button class="card curl" data-g="curl"><svg viewBox="0 0 120 120"><ellipse cx="60" cy="86" rx="52" ry="20" fill="#3fb6ff"/><ellipse cx="60" cy="86" rx="34" ry="13" fill="#fff"/><ellipse cx="60" cy="86" rx="16" ry="6" fill="#ff5d5d"/><ellipse cx="60" cy="66" rx="26" ry="10" fill="#9aa3b5"/><rect x="34" y="56" width="52" height="10" fill="#9aa3b5"/><ellipse cx="60" cy="56" rx="26" ry="10" fill="#c3c9d6"/><path d="M52 54v-10h22" stroke="#ff5fa2" stroke-width="7" fill="none" stroke-linecap="round"/></svg><b>컬링</b><span>과녁 한가운데로!</span></button>
  </div>
  <label class="camopt"><input type="checkbox" id="useCam" checked> 카메라로 몸 움직여서 하기</label>
  <p class="small" id="camNote">카메라가 없으면 화면을 톡 눌러서 해요.</p>
</section>

<section id="modes" class="screen" hidden>
  <h1 id="modeTitle">볼링</h1>
  <p>어떻게 할까요?</p>
  <div class="cards three">
    <button class="card m solo" data-m="solo"><b>혼자서</b><span>5번 도전하기</span></button>
    <button class="card m duo" data-m="duo"><b>둘이서</b><span>나란히 서서 동시에</span></button>
    <button class="card m tour" data-m="tour"><b>토너먼트</b><span>우승자 뽑기</span></button>
  </div>
  <button class="big alt" data-home>뒤로</button>
</section>

<section id="count" class="screen" hidden>
  <h1>몇 명이 할까요?</h1>
  <div id="countGrid" class="cgrid"></div>
  <button class="big alt" data-home>처음으로</button>
</section>

<section id="names" class="screen" hidden>
  <h1 id="namesTitle">이름을 넣어 주세요</h1>
  <div id="nameGrid" class="ngrid"></div>
  <p class="small">이름을 안 쓰면 '친구 1'처럼 들어가요.</p>
  <div class="row"><button class="big" id="namesGo">시작!</button><button class="big alt" data-home>처음으로</button></div>
</section>

<section id="bracket" class="screen" hidden>
  <h1 id="brTitle">대진표</h1>
  <div id="brArea" class="br"></div>
  <p id="brSub"></p>
  <div class="row"><button class="big" id="brGo">시작!</button><button class="big alt" id="brShuffle">다시 섞기</button><button class="big alt" data-home>처음으로</button></div>
</section>

<section id="end" class="screen" hidden>
  <svg id="trophy" hidden viewBox="0 0 120 120" width="120" height="120"><path d="M30 18h60v26c0 22-14 36-30 36S30 66 30 44z" fill="#ffd23f" stroke="#c99a00" stroke-width="4"/><path d="M30 26H16c0 18 8 26 18 28M90 26h14c0 18-8 26-18 28" fill="none" stroke="#c99a00" stroke-width="5"/><rect x="52" y="80" width="16" height="14" fill="#ffd23f"/><rect x="36" y="94" width="48" height="14" rx="5" fill="#ff5fa2"/></svg>
  <h2 id="endTitle">멋져요!</h2>
  <p id="endScore"></p>
  <p id="endSub" class="small"></p>
  <div class="row" id="endBtns"></div></section>

<script>
{
const $=id=>document.getElementById(id);
if(!window.THREE){$('camNote').textContent='3D 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';}
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.outputEncoding=THREE.sRGBEncoding;
$('stage').appendChild(R.domElement);
const cam=new THREE.PerspectiveCamera(55,1,0.1,200);
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<0.8?72:55;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

let scene=null,W={},S={phase:'menu'},gen=0;
let camPos=new THREE.Vector3(0,2,4),camLook=new THREE.Vector3(0,0,-10),lookCur=new THREE.Vector3(0,0,-10);
const later=(fn,ms)=>{const g=gen;setTimeout(()=>{if(g===gen)fn()},ms)};
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5},o));
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
function texCanvas(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
function baseScene(bg,fogFar){scene=new THREE.Scene();scene.background=new THREE.Color(bg);scene.fog=new THREE.Fog(bg,fogFar*.5,fogFar);
  scene.add(new THREE.HemisphereLight(0xffffff,0x6a5a80,.85));
  const d=new THREE.DirectionalLight(0xffffff,.85);d.position.set(3,12,-2);d.target.position.set(0,0,-12);scene.add(d,d.target);
  d.castShadow=true;d.shadow.mapSize.set(2048,2048);Object.assign(d.shadow.camera,{left:-8,right:8,top:16,bottom:-16,near:1,far:40});}
function makeArrow(color){const s=new THREE.Shape();s.moveTo(-.07,0);s.lineTo(.07,0);s.lineTo(.07,-2.2);s.lineTo(.22,-2.2);s.lineTo(0,-2.7);s.lineTo(-.22,-2.2);s.lineTo(-.07,-2.2);s.lineTo(-.07,0);
  const g=new THREE.ShapeGeometry(s);g.rotateX(Math.PI/2);const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85,side:THREE.DoubleSide}));
  const grp=new THREE.Group();m.position.y=.02;m.rotation.x=0;grp.add(m);scene.add(grp);return grp}

/* ---------- 볼링 ---------- */
const BALL_V=6,PIN_Z=-13,SP=.3,BALL_R=.22,PIN_R=.12,BP={M:3,bt:.35,pt:.35,pr:1.2,jit:.55,noise:.015};
function buildBowl(){baseScene('#2a1850',45);
  const lane=new THREE.Mesh(new THREE.PlaneGeometry(2.2,17.5),std('#fff',{roughness:.25,map:texCanvas(256,1024,g=>{
    for(let i=0;i<16;i++){g.fillStyle=i%2?'#eab97c':'#ddab6b';g.fillRect(i*16,0,16,1024)}
    g.fillStyle='rgba(110,55,20,.3)';for(let i=0;i<16;i++)g.fillRect(i*16,0,1,1024);
    g.fillStyle='#e0306f';for(let i=0;i<7;i++){const x=32+i*32,y=800-Math.abs(i-3)*26;g.beginPath();g.moveTo(x,y-24);g.lineTo(x-9,y);g.lineTo(x+9,y);g.fill()}
    for(let i=0;i<5;i++){g.beginPath();g.arc(64+i*32,930,5,0,7);g.fill()}})}));
  lane.rotation.x=-Math.PI/2;lane.position.set(0,0,-7.25);lane.receiveShadow=true;scene.add(lane);
  box(2.2,.02,3,std('#f4d3a1'),0,-.01,2.5);
  box(3.4,.02,1.2,std('#e0306f',{emissive:'#600'}),0,-.005,.6).scale.set(1,1,.02);
  [-1,1].forEach(s=>{box(.25,.02,17.5,std('#3b3550',{roughness:.3}),s*1.25,-.04,-7.25);
    const bump=box(.18,.3,17.5,std(s<0?'#ff5fa2':'#3fb6ff',{roughness:.35}),s*1.47,.15,-7.25);
    box(4,.05,30,std('#3a2468'),s*3.5,-.06,-8);
    for(let i=0;i<7;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(.09,16,12),new THREE.MeshBasicMaterial({color:['#ffd23f','#ff5fa2','#5ee08a','#3fb6ff'][i%4]}));l.position.set(s*1.47,.36,1-i*2.5);scene.add(l)}});
  box(3.4,.4,1.4,std('#160c2c'),0,-.2,-16.2);
  const sign=new THREE.Mesh(new THREE.PlaneGeometry(6,1.5),new THREE.MeshBasicMaterial({map:texCanvas(1024,256,g=>{g.fillStyle='#1d1040';g.fillRect(0,0,1024,256);g.font='140px Jua, sans-serif';g.textAlign='center';g.textBaseline='middle';g.shadowColor='#ff5fa2';g.shadowBlur=30;g.fillStyle='#ffe3f0';g.fillText('꽃잎 볼링장',512,135)})}));
  sign.position.set(0,2.6,-17.4);scene.add(sign);
  box(10,5,.2,std('#24124a'),0,1.5,-17.6);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(BALL_R,32,24),std('#ff4f98',{roughness:.18,metalness:.15,map:texCanvas(256,128,g=>{g.fillStyle='#ff4f98';g.fillRect(0,0,256,128);g.fillStyle='#ffd23f';for(let i=0;i<14;i++){const x=(i*53)%256,y=(i*37)%128;g.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5,r=k%2?5:12;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}g.fill()}})}));
  ball.castShadow=true;scene.add(ball);
  W={ball:{m:ball,x:0,z:0,vx:0,vz:0,active:false,gutter:false},pins:[],arrow:makeArrow('#ffd23f')};
  const prof=[[0,0],[.06,0],[.1,.06],[.12,.18],[.11,.3],[.07,.42],[.05,.5],[.06,.56],[.07,.63],[.06,.7],[.03,.745],[0,.75]].map(p=>new THREE.Vector2(p[0],p[1]));
  const pg=new THREE.LatheGeometry(prof,24),pm=std('#ffffff',{roughness:.2}),sm=std('#ff2f6d',{roughness:.3});
  const spots=[];for(let r=0;r<4;r++)for(let i=0;i<=r;i++)spots.push([(i-r/2)*SP,PIN_Z-r*SP*.866]);
  spots.forEach(([x,z])=>{const g=new THREE.Group();const b=new THREE.Mesh(pg,pm);b.castShadow=true;g.add(b);
    [.47,.52].forEach(y=>{const t=new THREE.Mesh(new THREE.TorusGeometry(.053,.011,8,24),sm);t.rotation.x=Math.PI/2;t.position.y=y;g.add(t)});
    scene.add(g);W.pins.push({g,hx:x,hz:z,x,z,vx:0,vz:0,fallen:false,tilt:0,fx:0,fz:-1,gone:false})});
  resetPins();resetBall();}
function resetPins(){W.pins.forEach(p=>Object.assign(p,{x:p.hx,z:p.hz,vx:0,vz:0,fallen:false,tilt:0,gone:false}));W.pins.forEach(p=>p.g.visible=true)}
function resetBall(){Object.assign(W.ball,{x:0,z:0,vx:0,vz:0,active:false,gutter:false});W.ball.m.visible=true;W.ball.m.position.set(0,BALL_R,0)}
function topple(p,dx,dz){if(p.fallen)return;const s=Math.hypot(p.vx,p.vz);p.fallen=true;if(s>.05){p.fx=p.vx/s;p.fz=p.vz/s}else{const d=Math.hypot(dx,dz)||1;p.fx=dx/d;p.fz=dz/d}hitSound()}
function collide(a,b,ra,rb,ma,mb,e){const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz),m=ra+rb;if(d>=m||d===0)return 0;const nx=dx/d,nz=dz/d,ov=m-d,t=ma+mb;
  a.x-=nx*ov*mb/t;a.z-=nz*ov*mb/t;b.x+=nx*ov*ma/t;b.z+=nz*ov*ma/t;const rv=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;if(rv>0)return 0;
  const j=-(1+e)*rv/(1/ma+1/mb);a.vx-=j*nx/ma;a.vz-=j*nz/ma;b.vx+=j*nx/mb;b.vz+=j*nz/mb;return -rv}
function stepBowl(dt){const b=W.ball,live=W.pins.filter(p=>!p.gone);
  if(b.active){b.x+=b.vx*dt;b.z+=b.vz*dt;b.m.rotation.x+=b.vz*dt/BALL_R;
    if(!b.gutter&&b.z>-12&&Math.abs(b.x)>1.1-BALL_R*.3){b.gutter=true;b.x=Math.sign(b.x)*1.25;b.vx=0;say('도랑이에요!')}

  $('brTitle').textContent=`${T.n}명 ${G.game==='bowl'?'볼링':'컬링'} 토너먼트`;$('brShuffle').hidden=T.played>0;
  if(nm){$('brSub').textContent=`다음 경기: ${nm.label} · ${T.names[nm.a]} vs ${T.names[nm.b]}`;$('brGo').textContent=`${nm.label} 시작!`}
  else{$('brSub').textContent='모든 경기가 끝났어요!';$('brGo').textContent='우승 화면 보기'}show('bracket')}
function showChamp(){clearGame();$('trophy').hidden=false;cheer();
  $('endTitle').textContent='우승!';$('endScore').textContent=T.champ.name;$('endSub').textContent=`준우승: ${T.champ.runner} · ${T.n}명 모두 멋지게 했어요!`;
  const eb=$('endBtns');eb.innerHTML='';eb.append(btn('새 토너먼트',()=>show('count')),btn('처음으로',toMenu,1));show('end')}
function clearGame(){gen++;lanes=[];cur=null;$('lanesUI').innerHTML='';$('hud').hidden=true;$('camBox').hidden=true;document.body.classList.remove('split');R.setScissorTest(false);R.clear()}
function startMatch(names){clearGame();show(null);$('hud').hidden=false;$('gname').textContent=G.game==='bowl'?'볼링':'컬링';
  const np=names.length;M={game:G.game,players:names.map(n=>({name:n,sc:[]})),per:np===1?5:3,ot:0,split:np>1,started:false,ended:false,seen:0};
  document.body.classList.toggle('split',np>1);for(let i=0;i<np;i++)lanes.push(makeLane(i,np));use(lanes[0]);board();
  if($('useCam').checked&&!camOn)startCam();$('camBox').hidden=!(camOn||camBusy)}
function toMenu(){clearGame();M=null;show('menu')}
function say(t,big,l=cur,quiet){if(!l)return;const m=l.msg;m.textContent=t;m.classList.add('on');clearTimeout(l.msgT);l.msgT=setTimeout(()=>m.classList.remove('on'),2000);if(quiet)return;if(big)cheer();else tones([[660,0,.15]])}
function hint(t){if(cur)cur.hint.textContent=t}

/* ---------- 입력 ---------- */
let held=false;
$('stage').addEventListener('pointerdown',e=>{held=true;if(lanes.length)tap(e)});
addEventListener('pointerup',()=>held=false);addEventListener('pointercancel',()=>held=false);
addEventListener('keydown',e=>{if(!lanes.length)return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!held){held=true;tap(null,e.code==='Enter'&&lanes.length>1?1:0)}}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter')held=false});
document.querySelectorAll('.card.bowl,.card.curl').forEach(c=>c.addEventListener('click',()=>{audio();pickGame(c.dataset.g)}));
document.querySelectorAll('.card.m').forEach(c=>c.addEventListener('click',()=>{audio();pickMode(c.dataset.m)}));
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=toMenu);
{const cg=$('countGrid');for(let n=2;n<=16;n++){const b=document.createElement('button');b.innerHTML=`${n}<small>명</small>`;b.onclick=()=>nameScreen(n);cg.appendChild(b)}}
$('namesGo').onclick=()=>{audio();const ns=readNames();G.mode==='tour'?makeBracket(ns):startMatch(ns)};
$('brGo').onclick=()=>{audio();const m=T.cur;m?startMatch([T.names[m.a],T.names[m.b]]):showChamp()};
$('brShuffle').onclick=()=>makeBracket(T.names);
$('menuBtn').onclick=()=>G.mode==='tour'&&T?showBracket():toMenu();

/* ---------- 카메라 · 사람 인식 (도토리 게임과 같은 방식) ---------- */
let camOn=false,camBusy=false,lm=null,lastVT=-1;const vid=$('vid');
function camSt(t,ok){const e=$('camSt');e.textContent=t;e.classList.toggle('ok',!!ok)}
async function startCam(){if(camOn||camBusy)return;camBusy=true;$('camBox').hidden=!lanes.length;camSt('카메라 준비 중…');
  try{const st=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});vid.srcObject=st;await vid.play();
    camSt('동작 인식 불러오는 중…');
    const V=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const files=await V.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:d},runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});
    try{lm=await V.PoseLandmarker.createFromOptions(files,o('GPU'))}catch(e){lm=await V.PoseLandmarker.createFromOptions(files,o('CPU'))}
    camOn=true}
  catch(e){console.warn(e);camOn=false;$('useCam').checked=false;$('camBox').hidden=true;$('camNote').textContent='카메라를 쓸 수 없어서 화면 터치로 진행해요.';}
  camBusy=false}
$('useCam').addEventListener('change',e=>{if(e.target.checked)startCam()});
function sense(){if(!camOn||vid.readyState<2||vid.currentTime===lastVT)return;lastVT=vid.currentTime;let res;try{res=lm.detectForVideo(vid,performance.now())}catch(e){return}
  const ps=(res.landmarks||[]).map(l=>({l,w:Math.abs(l[11].x-l[12].x),x:1-(l[11].x+l[12].x)/2}));
  if(lanes.length===1){ps.sort((a,b)=>b.w-a.w);feed(lanes[0].P,ps[0])}
  else{ps.sort((a,b)=>a.x-b.x);let A=null,B=null;if(ps.length>=2){A=ps[0];B=ps[ps.length-1]}else if(ps.length===1){if(ps[0].x<.5)A=ps[0];else B=ps[0]}feed(lanes[0].P,A);feed(lanes[1].P,B)}
  const n=lanes.filter(l=>l.P.found).length;camSt(n?(lanes.length>1?`${n}명 찾았어요`:'찾았어요!'):'카메라 앞에 서 주세요',n>0)}
function feed(P,p){if(!p){P.found=false;P.handUp=P.bothUp=false;return}const l=p.l;P.x=P.found?P.x+(p.x-P.x)*.3:p.x;P.found=true;
  const up=i=>l[i].visibility>.3&&l[i].y<l[0].y;P.handUp=up(15)||up(16);P.bothUp=up(15)&&up(16);const ln=(l[12].y-l[11].y)/(p.w||.01);P.lean+=(ln-P.lean)*.3}

/* ---------- 소리 ---------- */
let AC=null;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function noise(dur,freq,vol){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*dur|0,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start()}
let lastHit=0;function hitSound(){const t=performance.now();if(t-lastHit>60){lastHit=t;noise(.25,2600,.5)}}
function tones(l){if(!AC)return;const n=AC.currentTime;l.forEach(([f,t,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,n+t);g.gain.exponentialRampToValueAtTime(.22,n+t+.02);g.gain.exponentialRampToValueAtTime(.0001,n+t+d);o.connect(g).connect(AC.destination);o.start(n+t);o.stop(n+t+d+.05)})}
function cheer(){tones([[523,0,.2],[659,.12,.2],[784,.24,.2],[1047,.36,.4]])}

let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;if(!lanes.length||!M)return;sense();if(!M.started)readyCheck(dt);
  const w=innerWidth,h=innerHeight,n=lanes.length,vw=w/n;R.setScissorTest(true);
  lanes.forEach((l,i)=>{use(l);update(dt);R.setViewport(i*vw,0,vw,h);R.setScissor(i*vw,0,vw,h);l.cam.aspect=vw/h;l.cam.fov=l.cam.aspect<.9?68:55;l.cam.updateProjectionMatrix();R.render(l.scene,l.cam)})}
requestAnimationFrame(loop);
window.__T={G:()=>G,Tt:()=>T,pickGame,pickMode,startMatch,makeBracket,BP,sim:(x,a)=>{resetPins();resetBall();const b=W.ball,a2=a*.075+(Math.random()-.5)*2*BP.noise;b.x=x;b.vx=Math.sin(a2)*BALL_V;b.vz=-Math.cos(a2)*BALL_V;b.active=true;for(let i=0;i<2400;i++)stepBowl(1/240);return W.pins.filter(p=>p.fallen).length},tap:li=>tap(null,li||0),S:(li=0)=>lanes[li]?lanes[li].S:{phase:'none'},M:()=>M,lanes:()=>lanes,W:()=>W,throwIt:(li=0)=>{use(lanes[li]);throwIt()},cam:(x,h,l=0,both=false,li=0)=>{camOn=true;const P=lanes[li].P;P.found=true;P.x=x;P.handUp=h;P.bothUp=both;P.lean=l}};
}
