<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>꽃잎 볼링·컬링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 신나는 유치원 체육 시간, 크고 단순한 말
   IDEA: 장난감 같은 3D 볼링장과 눈 내린 컬링장
   PICTURE: 게임 화면 자체가 그림, 위에 점수판 한 줄
   COLOUR and TYPE: 사탕 분홍 #ff5fa2, 하늘 #3fb6ff, 노랑 #ffd23f / Jua
   LAYOUT: 전체 화면 3D + 위 점수판 + 가운데 큰 말풍선 + 아래 안내 */
:root{color-scheme:light;--pink:#ff5fa2;--sky:#3fb6ff;--sun:#ffd23f;--ink:#2b1640}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;word-break:keep-all;overflow:hidden;background:#2a1850;color:var(--ink);font-family:Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0}#stage canvas{display:block}
button{font:inherit;cursor:pointer}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:#fffdf6;border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#gname{font-size:22px;color:var(--pink)}
#board{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.fr{width:46px;text-align:center;border-radius:10px;background:#f3eaff;padding:2px 0}
.fr small{display:block;font-size:13px;color:#8a6fb0}.fr b{font-size:18px;display:block;min-height:24px}
.fr.on{background:var(--sun)}
.dot{width:22px;height:22px;border-radius:50%;background:#d9d2e6;border:3px solid #fff}
.dot.p{background:var(--pink)}.dot.b{background:var(--sky)}.dot.used{opacity:.35}
.tot{font-size:20px;margin-left:6px}
#menuBtn{border:0;border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink);font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.18);min-height:44px}
.msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-size:clamp(40px,9vw,88px);color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 6px 0 var(--pink);white-space:nowrap;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .25s}
.msg.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#lanesUI{position:fixed;inset:0;pointer-events:none}.laneui{position:absolute;top:0;bottom:0}
.split .laneui+.laneui{border-left:5px solid #fff}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;font-size:clamp(26px,3.8vw,44px);line-height:1.25;background:#FAC775;color:#26215C;border:4px solid #fff;border-radius:22px;padding:10px 22px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.hint:empty{display:none}
.split .msg{font-size:clamp(30px,5.5vw,64px)}.split .hint{font-size:clamp(20px,2.8vw,34px);max-width:80%}
.split #camBox{left:50%;transform:translateX(-50%);bottom:12px}
.pn.p{color:#d63a7f}.pn.b{color:#1f8fe0}
#camBox{position:fixed;left:10px;bottom:70px;width:160px;border-radius:14px;overflow:hidden;border:4px solid #fff;background:#000;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#camBox video{width:100%;display:block;transform:scaleX(-1)}
#camSt{background:#fff;font-size:14px;padding:4px 6px;text-align:center;line-height:1.3}#camSt.ok{background:#5ee08a}
.screen{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;padding:20px;text-align:center;background:radial-gradient(circle at 30% 20%,#ffe3f0,#d9f0ff 60%,#fff6d6)}
.screen h1{margin:0;font-size:clamp(34px,6vw,52px);line-height:1.05;color:var(--pink);text-shadow:0 4px 0 #fff}
.screen h2{margin:0;font-size:clamp(34px,6vw,52px);color:var(--pink)}
.screen p{margin:0;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:18px}
.card{border:0;border-radius:26px;padding:18px 12px 16px;background:#fff;box-shadow:0 8px 0 rgba(43,22,64,.15);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);transition:transform .15s}
.card:active{transform:translateY(4px)}
.card svg{width:120px;height:120px}.card b{font-size:30px}.card span{font-size:16px;color:#7a6496}
.card.bowl b{color:var(--pink)}.card.curl b{color:#1f8fe0}
.camopt{font-size:19px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 16px;min-height:44px}
.camopt input{width:24px;height:24px;accent-color:var(--pink)}
.small{font-size:15px!important;color:#7a6496;max-width:520px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{border:0;border-radius:18px;padding:14px 26px;font-size:22px;min-height:52px;background:var(--pink);color:#fff;box-shadow:0 5px 0 #c23a78}
.big.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.15)}
[hidden]{display:none!important}
.cards.sports{grid-template-columns:repeat(4,minmax(0,170px));gap:14px}
.cards.sports .card{padding:12px 8px}.cards.sports .card svg{width:90px;height:90px}.cards.sports .card b{font-size:26px}
.cards.modes4{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:min(760px,94vw)}
.cards.modes4 .card{min-height:min(25vh,220px);justify-content:center;border:5px solid transparent}
.cards.modes4 .card{padding:10px 8px;gap:2px}.cards.modes4 .card svg{width:min(11vh,84px);height:min(11vh,84px)}.cards.modes4 .card b{font-size:clamp(34px,5vw,48px)}.cards.modes4 .card span{font-size:clamp(17px,2.2vw,22px)}
.card.m.solo{border-color:#ffb3d1}.card.m.duo{border-color:#9fd6ff}.card.m.tour{border-color:#ffd98a}.card.m.prac{border-color:#a8eabf}.card.m.prac b{color:#2d9a55}
.sh{width:28px;height:28px;border-radius:50%;background:#eee;display:grid;place-items:center;font-size:16px}.sh.ok{background:#5ee08a;color:#fff}.sh.no{background:#f6dbe6;color:#c23a78}
#guide{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,10,40,.35);pointer-events:none}
.gcard{background:#fffdf6;border:6px solid #FAC775;border-radius:28px;padding:16px 26px 20px;text-align:center;width:min(600px,92vw)}
.gcard h2{margin:0;font-size:clamp(32px,5vw,48px);color:var(--pink)}
#gArt svg{width:min(380px,70vw,42vh);height:auto}
#gX{margin:4px 0 12px;font-size:clamp(22px,3.4vw,34px);line-height:1.3;color:#26215C}
.gbar{height:14px;border-radius:7px;background:#eee;overflow:hidden}.gbar i{display:block;height:100%;width:100%;background:#EF9F27}.gbar i.run{animation:shrink 3s linear forwards}
@keyframes shrink{to{width:0}}
@keyframes lean{0%,100%{transform:rotate(0)}18%{transform:rotate(-10deg)}38%{transform:rotate(10deg)}55%{transform:rotate(0)}}
@keyframes armup{0%,55%{transform:rotate(0)}70%,92%{transform:rotate(-140deg)}100%{transform:rotate(0)}}
@keyframes legup{0%,35%{transform:rotate(0)}55%,80%{transform:rotate(-70deg)}100%{transform:rotate(0)}}
@keyframes sh1{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes sh2{0%,49%{opacity:0}50%,100%{opacity:1}}
.lb{transform-box:view-box;transform-origin:64px 102px;animation:lean 2.4s ease-in-out infinite}
.au{transform-box:view-box;transform-origin:61px 42px;animation:armup 2.4s ease-in-out infinite}
.lu{transform-box:view-box;transform-origin:62px 70px;animation:legup 1.6s ease-in-out infinite}
.s1{animation:sh1 1.4s infinite}.s2{animation:sh2 1.4s infinite}
.card.m b{font-size:32px}.card.m.solo b{color:var(--pink)}.card.m.duo b{color:#1f8fe0}.card.m.tour b{color:#e08a00}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;width:min(900px,100%)}
.ngrid div{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:6px 10px}
.ngrid span{font-size:18px;color:#8a6fb0;min-width:1.4em}
.ngrid input{flex:1;font:inherit;font-size:20px;border:3px solid #f3d3e4;border-radius:10px;padding:6px 8px;min-height:44px;width:100%}
.ngrid.one{grid-template-columns:minmax(0,320px);justify-content:center}.ngrid.two{grid-template-columns:repeat(2,minmax(0,300px));justify-content:center}
.cgrid{display:grid;grid-template-columns:repeat(5,64px);gap:10px}
.cgrid button{border:0;border-radius:16px;background:#fff;font-size:28px;min-height:64px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.cgrid small{font-size:14px}
.br{display:flex;gap:14px;overflow-x:auto;max-width:100%;padding:8px;background:#ffffffaa;border-radius:20px}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:8px;min-width:130px}
.col h3{margin:0;font-size:16px;color:#8a6fb0;font-weight:400}
.mt{background:#fff;border-radius:12px;padding:4px 8px;font-size:17px;text-align:left;border:3px solid transparent}
.mt.now{border-color:var(--sun)}.sl{display:flex;justify-content:space-between;gap:8px}.sl.win{color:#d63a7f}.sl.lose{opacity:.4}
.prow{display:flex;align-items:center;gap:5px;padding:2px 6px;border-radius:12px}.prow.on{background:#fff4c2}
.pn{font-size:18px;min-width:3.5em}
#board{flex-direction:column;align-items:stretch}
@media(max-width:600px){.cards.sports{grid-template-columns:repeat(2,minmax(0,1fr))}.cards.modes4 .card{min-height:22vh}.ngrid.two{grid-template-columns:minmax(0,1fr)}.cgrid{grid-template-columns:repeat(5,52px)}.pn{font-size:15px}}
@media(max-width:600px){.cards:not(.sports):not(.modes4){grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card svg{width:84px;height:84px}.card b{font-size:24px}.fr{width:36px}.fr b{font-size:15px}#camBox{width:110px}#gname{display:none}}
@media(prefers-reduced-motion:reduce){.msg{transition:none}.lb,.au,.lu,.s1,.s2{animation:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head><body>
<div id="stage"></div>
<header id="hud" hidden><div class="pill" id="gname">볼링</div><div class="pill" id="board"></div><button id="menuBtn">처음으로</button></header>
<div id="lanesUI"></div>
<div id="guide" hidden><div class="gcard"><h2 id="gT"></h2><div id="gArt"></div><p id="gX"></p><div class="gbar"><i id="gBar"></i></div></div></div>
<div id="camBox" hidden><video id="vid" playsinline muted></video><div id="camSt">카메라 준비 중…</div></div>

<section id="menu" class="screen">
  <h1>꽃잎반 3D 스포츠</h1>
  <p>무엇을 해 볼까요?</p>
  <div class="cards sports">
    <button class="card bowl" data-g="bowl"><svg viewBox="0 0 120 120"><path d="M48 104c-6-18-4-30 2-40 4-7 3-14 2-20-1-9 3-16 8-16s9 7 8 16c-1 6-2 13 2 20 6 10 8 22 2 40z" fill="#fff" stroke="#d8cbe8" stroke-width="2"/><rect x="51" y="50" width="18" height="4" rx="2" fill="#ff3d7f"/><circle cx="34" cy="90" r="18" fill="#ff5fa2"/></svg><b>볼링</b></button>
    <button class="card curl" data-g="curl"><svg viewBox="0 0 120 120"><ellipse cx="60" cy="86" rx="52" ry="20" fill="#3fb6ff"/><ellipse cx="60" cy="86" rx="34" ry="13" fill="#fff"/><ellipse cx="60" cy="86" rx="16" ry="6" fill="#ff5d5d"/><ellipse cx="60" cy="62" rx="26" ry="10" fill="#9aa3b5"/><path d="M52 58v-10h22" stroke="#ff5fa2" stroke-width="7" fill="none" stroke-linecap="round"/></svg><b>컬링</b></button>
    <button class="card arch" data-g="arch"><svg viewBox="0 0 120 120"><circle cx="60" cy="58" r="44" fill="#fff" stroke="#ddd" stroke-width="2"/><circle cx="60" cy="58" r="35" fill="#3a3550"/><circle cx="60" cy="58" r="26" fill="#3b8cff"/><circle cx="60" cy="58" r="17" fill="#ff5d5d"/><circle cx="60" cy="58" r="8" fill="#ffd23f"/><path d="M60 58 L104 14" stroke="#8a5a2b" stroke-width="4"/><path d="M98 12l10-4-4 10" fill="#ff5fa2"/></svg><b>양궁</b></button>
    <button class="card tuho" data-g="tuho"><svg viewBox="0 0 120 120"><path d="M38 110 q-14-34 6-48 q-4-8 4-12 h24 q8 4 4 12 q20 14 6 48z" fill="#5fb8a0"/><ellipse cx="60" cy="50" rx="13" ry="4" fill="#1d2b2b"/><path d="M58 52 L74 6" stroke="#7a4a1c" stroke-width="4"/><path d="M50 52 L40 10" stroke="#7a4a1c" stroke-width="4"/></svg><b>투호</b></button>
    <button class="card hoop" data-g="hoop"><svg viewBox="0 0 120 120"><rect x="24" y="8" width="72" height="46" rx="4" fill="#fff" stroke="#ccc" stroke-width="2"/><ellipse cx="60" cy="56" rx="22" ry="6" fill="none" stroke="#ff6a00" stroke-width="5"/><path d="M40 58 L48 84 H72 L80 58" fill="none" stroke="#bbb" stroke-width="2"/><circle cx="60" cy="98" r="16" fill="#ff7a1a"/><path d="M44 98h32M60 82v32" stroke="#4a1d00" stroke-width="2"/></svg><b>농구</b></button>
    <button class="card kick" data-g="kick"><svg viewBox="0 0 120 120"><rect x="12" y="20" width="96" height="56" fill="none" stroke="#fff" stroke-width="6"/><path d="M12 20h96v56H12z" fill="#e8f6e8"/><path d="M12 20v56M108 20v56M12 20h96" stroke="#9aa" stroke-width="5"/><rect x="0" y="76" width="120" height="44" fill="#66c853"/><circle cx="60" cy="96" r="14" fill="#fff" stroke="#333" stroke-width="2"/><circle cx="60" cy="96" r="5" fill="#333"/></svg><b>승부차기</b></button>
    <button class="card snow" data-g="snow"><svg viewBox="0 0 120 120"><circle cx="60" cy="88" r="26" fill="#fff" stroke="#c9d6e6" stroke-width="2"/><circle cx="60" cy="48" r="18" fill="#fff" stroke="#c9d6e6" stroke-width="2"/><rect x="46" y="20" width="28" height="14" fill="#ff5fa2"/><circle cx="54" cy="46" r="3"/><circle cx="66" cy="46" r="3"/><path d="M60 52 l12 3 -12 3z" fill="#ff7a1a"/><circle cx="100" cy="30" r="9" fill="#fff" stroke="#c9d6e6" stroke-width="2"/></svg><b>눈덩이</b></button>
  </div>
  <label class="camopt"><input type="checkbox" id="useCam" checked> 카메라로 몸 움직여서 하기</label>
  <label class="camopt"><input type="checkbox" id="useGuide" checked> 동작 안내 그림 보여 주기</label>
  <p class="small" id="camNote">카메라가 없으면 화면을 톡 눌러서 해요.</p>
</section>

<section id="modes" class="screen" hidden>
  <h1 id="modeTitle">볼링</h1>
  <p>어떻게 할까요?</p>
  <div class="cards modes4">
    <button class="card m solo" data-m="solo"><svg viewBox="0 0 64 64"><circle cx="32" cy="20" r="11" fill="#ff5fa2"/><path d="M12 58c0-14 9-22 20-22s20 8 20 22z" fill="#ff5fa2"/></svg><b>혼자서</b><span>5번 도전</span></button>
    <button class="card m duo" data-m="duo"><svg viewBox="0 0 64 64"><circle cx="20" cy="22" r="9" fill="#ff5fa2"/><path d="M4 58c0-12 7-19 16-19s16 7 16 19z" fill="#ff5fa2"/><circle cx="44" cy="22" r="9" fill="#3fb6ff"/><path d="M28 58c0-12 7-19 16-19s16 7 16 19z" fill="#3fb6ff"/></svg><b>둘이서</b><span>나란히 동시에</span></button>
    <button class="card m tour" data-m="tour"><svg viewBox="0 0 64 64"><path d="M18 8h28v14c0 10-6 18-14 18S18 32 18 22z" fill="#ffd23f"/><path d="M18 12H8c0 10 5 14 11 15M46 12h10c0 10-5 14-11 15" fill="none" stroke="#e0a800" stroke-width="3"/><rect x="28" y="40" width="8" height="8" fill="#ffd23f"/><rect x="18" y="48" width="28" height="8" rx="3" fill="#ff5fa2"/></svg><b>토너먼트</b><span>우승자 뽑기</span></button>
    <button class="card m prac" data-m="practice"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#5ee08a"/><path d="M26 20 L46 32 L26 44z" fill="#fff"/></svg><b>연습하기</b><span>이름 없이 바로</span></button>
  </div>
  <button class="big alt" data-home>뒤로</button>
</section>

<section id="count" class="screen" hidden>
  <h1>몇 명이 할까요?</h1>
  <div id="countGrid" class="cgrid"></div>
  <button class="big alt" data-home>처음으로</button>
</section>

<section id="names" class="screen" hidden>
  <h1 id="namesTitle">이름을 넣어 주세요</h1>
  <div id="nameGrid" class="ngrid"></div>
  <p class="small">이름을 안 쓰면 '친구 1'처럼 들어가요.</p>
  <div class="row"><button class="big" id="namesGo">시작!</button><button class="big alt" data-home>처음으로</button></div>
</section>

<section id="bracket" class="screen" hidden>
  <h1 id="brTitle">대진표</h1>
  <div id="brArea" class="br"></div>
  <p id="brSub"></p>
  <div class="row"><button class="big" id="brGo">시작!</button><button class="big alt" id="brShuffle">다시 섞기</button><button class="big alt" data-home>처음으로</button></div>
</section>

<section id="end" class="screen" hidden>
  <svg id="trophy" hidden viewBox="0 0 120 120" width="120" height="120"><path d="M30 18h60v26c0 22-14 36-30 36S30 66 30 44z" fill="#ffd23f" stroke="#c99a00" stroke-width="4"/><path d="M30 26H16c0 18 8 26 18 28M90 26h14c0 18-8 26-18 28" fill="none" stroke="#c99a00" stroke-width="5"/><rect x="52" y="80" width="16" height="14" fill="#ffd23f"/><rect x="36" y="94" width="48" height="14" rx="5" fill="#ff5fa2"/></svg>
  <h2 id="endTitle">멋져요!</h2>
  <p id="endScore"></p>
  <p id="endSub" class="small"></p>
  <div class="row" id="endBtns"></div></section>

<script>
{
const $=id=>document.getElementById(id);
if(!window.THREE){$('camNote').textContent='3D 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';}
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.outputEncoding=THREE.sRGBEncoding;
$('stage').appendChild(R.domElement);
const cam=new THREE.PerspectiveCamera(55,1,0.1,200);
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<0.8?72:55;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

let scene=null,W={},S={phase:'menu'},gen=0;
let camPos=new THREE.Vector3(0,2,4),camLook=new THREE.Vector3(0,0,-10),lookCur=new THREE.Vector3(0,0,-10);
const later=(fn,ms)=>{const g=gen;setTimeout(()=>{if(g===gen)fn()},ms)};
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5},o));
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
function texCanvas(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
function baseScene(bg,fogFar){scene=new THREE.Scene();scene.background=new THREE.Color(bg);scene.fog=new THREE.Fog(bg,fogFar*.5,fogFar);
  scene.add(new THREE.HemisphereLight(0xffffff,0x6a5a80,.85));
  const d=new THREE.DirectionalLight(0xffffff,.85);d.position.set(3,12,-2);d.target.position.set(0,0,-12);scene.add(d,d.target);
  d.castShadow=true;d.shadow.mapSize.set(2048,2048);Object.assign(d.shadow.camera,{left:-8,right:8,top:16,bottom:-16,near:1,far:40});}
function makeArrow(color){const s=new THREE.Shape();s.moveTo(-.07,0);s.lineTo(.07,0);s.lineTo(.07,-2.2);s.lineTo(.22,-2.2);s.lineTo(0,-2.7);s.lineTo(-.22,-2.2);s.lineTo(-.07,-2.2);s.lineTo(-.07,0);
  const g=new THREE.ShapeGeometry(s);g.rotateX(Math.PI/2);const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85,side:THREE.DoubleSide}));

const BALL_V=6,PIN_Z=-13,PSP=.3,BALL_R=.22,PIN_R=.12,BP={M:3,bt:.35,pt:.35,pr:1.2,jit:.55,noise:.015};
function buildBowl(){baseScene('#2a1850',45);

function resetPins(){W.pins.forEach(p=>Object.assign(p,{x:p.hx,z:p.hz,vx:0,vz:0,fallen:false,tilt:0,gone:false}));W.pins.forEach(p=>p.g.visible=true)}
function resetBall(){Object.assign(W.ball,{x:0,z:0,vx:0,vz:0,active:false,gutter:false});W.ball.m.visible=true;W.ball.m.position.set(0,BALL_R,0)}
function topple(p,dx,dz){if(p.fallen)return;const s=Math.hypot(p.vx,p.vz);p.fallen=true;if(s>.05){p.fx=p.vx/s;p.fz=p.vz/s}else{const d=Math.hypot(dx,dz)||1;p.fx=dx/d;p.fz=dz/d}hitSound()}
function collide(a,b,ra,rb,ma,mb,e){const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz),m=ra+rb;if(d>=m||d===0)return 0;const nx=dx/d,nz=dz/d,ov=m-d,t=ma+mb;
  a.x-=nx*ov*mb/t;a.z-=nz*ov*mb/t;b.x+=nx*ov*ma/t;b.z+=nz*ov*ma/t;const rv=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;if(rv>0)return 0;
  const j=-(1+e)*rv/(1/ma+1/mb);a.vx-=j*nx/ma;a.vz-=j*nz/ma;b.vx+=j*nx/mb;b.vz+=j*nz/mb;return -rv}
function stepBowl(dt){const b=W.ball,live=W.pins.filter(p=>!p.gone);
  if(b.active){b.x+=b.vx*dt;b.z+=b.vz*dt;b.m.rotation.x+=b.vz*dt/BALL_R;
    if(!b.gutter&&b.z>-12&&Math.abs(b.x)>1.1-BALL_R*.3){b.gutter=true;b.x=Math.sign(b.x)*1.25;b.vx=0;say('도랑이에요!')}
    if(Math.abs(b.x)>1.25){b.x=Math.sign(b.x)*1.25;b.vx=0}if(b.z<-15.6){b.active=false;b.m.visible=false}
    if(!b.gutter)live.forEach(p=>{if(collide(b,p,BALL_R,PIN_R,BP.M,1.5,.4)>BP.bt)topple(p,p.x-b.x,p.z-b.z)})}
  for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){const p=live[i],q=live[j];const r=collide(p,q,PIN_R,PIN_R,1.5,1.5,.5);
    if(r>.05&&BP.jit){[p,q].forEach(o=>{const t=(Math.random()-.5)*2*BP.jit,c=Math.cos(t),sn=Math.sin(t),vx=o.vx;o.vx=vx*c-o.vz*sn;o.vz=vx*sn+o.vz*c})}
    if(r>BP.pt&&Math.random()<(r-BP.pt)/BP.pr){if(p.fallen&&!q.fallen)topple(q,q.x-p.x,q.z-p.z);else if(q.fallen&&!p.fallen)topple(p,p.x-q.x,p.z-q.z);else{topple(p,p.x-q.x,p.z-q.z);topple(q,q.x-p.x,q.z-p.z)}}}
  live.forEach(p=>{const s=Math.hypot(p.vx,p.vz);if(s>0){const n=Math.max(0,s-(p.fallen?2.2:3.5)*dt);p.vx*=n/s;p.vz*=n/s}
    p.x+=p.vx*dt;p.z+=p.vz*dt;if(Math.abs(p.x)>1.15||p.z<-15.4){if(!p.fallen)topple(p,p.vx,p.vz);p.vx*=.5;p.vz*=.5}
    if(p.fallen&&p.tilt<1)p.tilt=Math.min(1,p.tilt+dt*3.2)})}
function drawBowl(){const b=W.ball;b.m.position.set(b.x,b.gutter?BALL_R-.06:BALL_R,b.z);
  W.pins.forEach(p=>{p.g.visible=!p.gone;p.g.position.set(p.x,p.tilt*.09,p.z);p.g.quaternion.setFromAxisAngle(new THREE.Vector3(p.fz,0,-p.fx).normalize(),p.tilt*Math.PI/2*.97)})}

function makeStone(i){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(ST_R,ST_R*.92,.2,32),std('#9aa3b5',{roughness:.4}));body.position.y=.1;body.castShadow=true;g.add(body);

  const h=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.32),std(i?'#1f7fd0':'#d63a7f'));h.position.set(0,.27,.05);g.add(h);scene.add(g);
  return{m:g,x:0,z:0,vx:0,vz:0,out:false,owner:i}}
function stepCurl(dt){const st=W.stones.filter(s=>!s.out);
  st.forEach(s=>{const sp=Math.hypot(s.vx,s.vz);if(sp>0){const dec=(S.sweep&&s===W.cur)?.27:.55,n=Math.max(0,sp-dec*dt);s.vx*=n/sp;s.vz*=n/sp}
    s.x+=s.vx*dt;s.z+=s.vz*dt;s.m.rotation.y+=sp*dt*.6;if(Math.abs(s.x)>SIDE-ST_R*.5||s.z<BACK){s.out=true;s.m.visible=false}});
  for(let i=0;i<st.length;i++)for(let j=i+1;j<st.length;j++)if(collide(st[i],st[j],ST_R,ST_R,1,1,.9)>.3)noise(.12,1800,.35);
  st.forEach(s=>s.m.position.set(s.x,0,s.z));
  const c=W.cur;W.brooms.visible=S.sweep&&c&&!c.out&&Math.hypot(c.vx,c.vz)>.05;if(W.brooms.visible){W.brooms.position.set(c.x+Math.sin(performance.now()/60)*.12,0,c.z-.6)}}
function pts(s){if(s.out)return 0;const d=Math.hypot(s.x,s.z-HZ);return d<=.6?3:d<=1.2?2:d<=1.8+ST_R?1:0}

  if(s.out)say('밖으로 나갔어요!');else{const p=pts(s);say(p===3?'한가운데! 3점':p?`${p}점 자리!`:'잘했어요!',p===3)}laneDone()}

function ground(col,tex,w=40,d=40,z=-10){const g=new THREE.Mesh(new THREE.PlaneGeometry(w,d),std(col,{roughness:.85,map:tex||null}));g.rotation.x=-Math.PI/2;g.position.z=z;g.receiveShadow=true;scene.add(g);return g}
function trees(n,z0,col){for(let i=0;i<n;i++){const s=i%2?1:-1,x=s*(4.5+(i%3)*1.4),z=z0-i*2.2;mesh(new THREE.ConeGeometry(.8,2.4,8),std(col||'#3aa86b'),x,1.2,z);mesh(new THREE.CylinderGeometry(.12,.12,.4,8),std('#7a4a1c'),x,.2,z)}}
function stick(len,col,tip){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(.016,.016,len,8),std(col));b.rotation.x=Math.PI/2;g.add(b);
  const t=new THREE.Mesh(new THREE.ConeGeometry(.035,.12,8),std(tip));t.rotation.x=-Math.PI/2;t.position.z=-len/2-.05;g.add(t);
  const f=new THREE.Mesh(new THREE.BoxGeometry(.09,.004,.14),std('#ff5fa2'));f.position.z=len/2-.07;g.add(f);const f2=f.clone();f2.rotation.z=Math.PI/2;g.add(f2);

function fly(obj,from,to,dur,h){W.fly={obj,from,to,dur,h,t:0,done:false}}
function flyPt(F,k){return new THREE.Vector3(lerp(F.from.x,F.to.x,k),lerp(F.from.y,F.to.y,k)+4*F.h*k*(1-k),lerp(F.from.z,F.to.z,k))}
function flyStep(dt,orient){const F=W.fly;F.t=Math.min(F.dur,F.t+dt);const k=F.t/F.dur,p=flyPt(F,k);F.obj.position.copy(p);
  if(orient){const q=flyPt(F,Math.min(1,k+.02)),r=flyPt(F,Math.max(0,k-.02));F.obj.lookAt(k>.02?r:p.clone().multiplyScalar(2).sub(q))}
  return F.t>=F.dur}

  if(S.phase==='aim'){if(camOn){if(P.found){const k=Math.min(1,dt*2.5),bw=S.game==='bowl',lim=bw?.8:1.2;
        const px=M.split||!['bowl','curl'].includes(S.game)?0:Math.max(-lim,Math.min(lim,(P.x-.5)*(bw?2.6:3.6)));S.posX+=(px-S.posX)*k;
        const ln=Math.abs(P.lean)<.08?0:Math.max(-1,Math.min(1,P.lean/.35));S.aim+=(ln-S.aim)*k;

      const moving=W.pins.some(p=>!p.gone&&(Math.hypot(p.vx,p.vz)>.05||(p.fallen&&p.tilt<1)));if((!W.ball.active&&!moving&&S.rollT>1)||S.rollT>7)endBowl()}

  for(let i=0;i<n;i++){const d=document.createElement('div'),sp=document.createElement('span'),inp=document.createElement('input');sp.textContent=i+1;inp.id='nm'+i;inp.maxLength=8;inp.placeholder='친구 '+(i+1);inp.setAttribute('aria-label',(i+1)+'번 이름');

  $('namesTitle').textContent=n===1?'도전할 친구 이름':n===2?'대결할 두 친구 이름':`${n}명의 이름을 넣어 주세요`;$('namesGo').textContent=G.mode==='tour'?'대진표 만들기':'시작!';
  G.n=n;show('names');setTimeout(()=>{const f=$('nm0');if(f&&matchMedia('(pointer:fine)').matches)f.focus()},50)}
function readNames(){return [...Array(G.n)].map((_,i)=>($('nm'+i).value||'').trim()||'친구 '+(i+1))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function makeBracket(names){const n=names.length;let P2=2;while(P2<n)P2*=2;const m=P2/2,byes=P2-n,bs=new Set();for(let k=0;k<byes;k++)bs.add(Math.floor(k*m/byes));
  const o=shuffle([...Array(n).keys()]),r0=[];let q=0;for(let j=0;j<m;j++){if(bs.has(j))r0.push(o[q++],-1);else r0.push(o[q++],o[q++])}
  T={names,n,R:Math.log2(P2),rounds:[r0],scores:[[]],played:0,champ:null};for(let r=1;r<=T.R;r++){T.rounds.push(Array(P2>>r).fill(null));T.scores.push([])}
  for(let j=0;j<m;j++)if(r0[2*j+1]===-1)T.rounds[1][j]=r0[2*j];showBracket()}
function nextMatch(){for(let r=0;r<T.R;r++){const L=T.rounds[r].length;let num=0;for(let j=0;j<L/2;j++){const a=T.rounds[r][2*j],b=T.rounds[r][2*j+1];if(a===-1||b===-1)continue;num++;
  if(a!==null&&b!==null&&T.rounds[r+1][j]===null)return{r,j,a,b,label:L===2?'결승':`${L}강 ${num}경기`}}}return null}
function showBracket(){clearGame();const nm=nextMatch();T.cur=nm;const area=$('brArea');area.innerHTML='';
  T.rounds.forEach((sl,r)=>{const col=document.createElement('div');col.className='col';const h=document.createElement('h3');h.textContent=r===T.R?'우승':sl.length===2?'결승':sl.length+'강';col.appendChild(h);
    if(r===T.R){const d=document.createElement('div');d.className='mt';d.textContent=sl[0]===null?'누구일까?':T.names[sl[0]];col.appendChild(d)}
    else for(let j=0;j<sl.length/2;j++){const d=document.createElement('div');d.className='mt'+(nm&&nm.r===r&&nm.j===j?' now':'');const nx=T.rounds[r+1][j],sc=T.scores[r][j];
      [0,1].forEach(k=>{const v=sl[2*j+k],row=document.createElement('div');row.className='sl'+(nx!==null&&v>=0?(nx===v?' win':' lose'):'');
        const a=document.createElement('span');a.textContent=v===-1?'부전승':v===null?'?':T.names[v];const b=document.createElement('b');b.textContent=sc?sc[k]:'';row.append(a,b);d.appendChild(row)});col.appendChild(d)}
    area.appendChild(col)});
  $('brTitle').textContent=`${T.n}명 ${GNAME[G.game]} 토너먼트`;$('brShuffle').hidden=T.played>0;
  if(nm){$('brSub').textContent=`다음 경기: ${nm.label} · ${T.names[nm.a]} vs ${T.names[nm.b]}`;$('brGo').textContent=`${nm.label} 시작!`}
  else{$('brSub').textContent='모든 경기가 끝났어요!';$('brGo').textContent='우승 화면 보기'}show('bracket')}
function showChamp(){clearGame();$('trophy').hidden=false;cheer();
  $('endTitle').textContent='우승!';$('endScore').textContent=T.champ.name;$('endSub').textContent=`준우승: ${T.champ.runner} · ${T.n}명 모두 멋지게 했어요!`;
  const eb=$('endBtns');eb.innerHTML='';eb.append(btn('새 토너먼트',()=>show('count')),btn('처음으로',toMenu,1));show('end')}
function clearGame(){gen++;$('guide').hidden=true;lanes=[];cur=null;$('lanesUI').innerHTML='';$('hud').hidden=true;$('camBox').hidden=true;document.body.classList.remove('split');R.setScissorTest(false);R.clear()}
function startMatch(names){clearGame();show(null);$('hud').hidden=false;$('gname').textContent=GNAME[G.game];const pr=G.mode==='practice';$('menuBtn').textContent=pr?'그만하기':G.mode==='tour'?'대진표':'처음으로';
  const np=names.length;M={game:G.game,players:names.map(n=>({name:n,sc:[]})),per:pr?Infinity:np===1?5:3,practice:pr,ot:0,split:np>1,started:false,ended:false,seen:0};
  if($('useGuide').checked)showGuide(G.game);
  document.body.classList.toggle('split',np>1);for(let i=0;i<np;i++)lanes.push(makeLane(i,np));use(lanes[0]);board();
  if($('useCam').checked&&!camOn)startCam();$('camBox').hidden=!(camOn||camBusy)}
function toMenu(){clearGame();M=null;show('menu')}
const GTXT={bowl:'몸을 기울여 방향, 손 번쩍! 데굴데굴',curl:'몸을 기울여 방향, 손 번쩍! 쓰~윽',arch:'몸을 기울여 조준, 손 번쩍! 슝',tuho:'몸을 기울여 방향, 손 번쩍! 항아리에 쏙',hoop:'몸을 기울여 방향, 두 손을 가슴에서 머리 위로 쭉!',kick:'몸을 기울여 방향, 발을 들어 뻥! (발끝까지 보이게)',snow:'몸을 기울여 조준, 손 번쩍! 눈사람 맞히기'};
const FG='stroke="#444441" stroke-width="5" stroke-linecap="round" fill="none"',HD='<circle cx="58" cy="24" r="10" fill="#FAC775" stroke="#444441" stroke-width="3"/>',LR='<path d="M18 92 l8-6 v12z M110 92 l-8-6 v12z" fill="#D85A30"/>';
const PROP={bowl:'<circle cx="112" cy="98" r="9" fill="#ff5fa2"/>',curl:'<ellipse cx="112" cy="100" rx="12" ry="5" fill="#888780"/>',arch:'<circle cx="112" cy="40" r="14" fill="#fff" stroke="#D85A30" stroke-width="3"/><circle cx="112" cy="40" r="6" fill="#E24B4A"/>',tuho:'<path d="M104 104 q-6-18 2-24 h12 q8 6 2 24z" fill="#5fb8a0"/>',snow:'<circle cx="112" cy="92" r="10" fill="#fff" stroke="#888780" stroke-width="2"/><circle cx="112" cy="74" r="7" fill="#fff" stroke="#888780" stroke-width="2"/>'};
function figSVG(g){const a=ACT[g];
  if(a==='push')return `<svg viewBox="0 -14 130 124"><g class="s1"><g ${FG}><path d="M60 34 L60 72"/><path d="M60 44 L48 54 L58 57"/><path d="M60 44 L72 54 L62 57"/><path d="M60 72 L52 102"/><path d="M60 72 L68 102"/></g><circle cx="60" cy="58" r="8" fill="#EF9F27"/></g><g class="s2"><g ${FG}><path d="M60 34 L60 72"/><path d="M60 44 L50 12"/><path d="M60 44 L70 12"/><path d="M60 72 L52 102"/><path d="M60 72 L68 102"/></g><circle cx="60" cy="-4" r="8" fill="#EF9F27"/></g><circle cx="60" cy="24" r="10" fill="#FAC775" stroke="#444441" stroke-width="3"/><circle cx="112" cy="30" r="10" fill="none" stroke="#ff6a00" stroke-width="3"/></svg>`;
  if(a==='kick')return `<svg viewBox="0 0 130 110"><g ${FG}><path d="M60 34 L62 70"/><path d="M60 42 L46 58"/><path d="M60 42 L74 58"/><path d="M62 70 L56 102"/></g><g class="lu"><path d="M62 70 L70 102" ${FG}/></g>${HD}<circle cx="86" cy="100" r="7" fill="#fff" stroke="#444441" stroke-width="2"/><rect x="100" y="60" width="26" height="40" fill="none" stroke="#0F6E56" stroke-width="3"/></svg>`;
  return `<svg viewBox="0 0 130 110"><g class="lb"><g ${FG}><path d="M60 34 L64 72"/><path d="M61 42 L46 60"/><path d="M64 72 L54 102"/><path d="M64 72 L74 102"/></g><g class="au"><path d="M61 42 L74 62" ${FG}/></g>${HD}</g>${LR}${PROP[g]||''}</svg>`}
function showGuide(g){M.guide=true;$('gT').textContent=GNAME[g];$('gArt').innerHTML=figSVG(g);$('gX').textContent=GTXT[g];const bar=$('gBar');bar.classList.remove('run');void bar.offsetWidth;bar.classList.add('run');$('guide').hidden=false;
  later(()=>{$('guide').hidden=true;if(M)M.guide=false},3000)}
function say(t,big,l=cur,quiet){if(!l)return;const m=l.msg;m.textContent=t;m.classList.add('on');clearTimeout(l.msgT);l.msgT=setTimeout(()=>m.classList.remove('on'),2000);if(quiet)return;if(big)cheer();else tones([[660,0,.15]])}
function hint(t){if(cur)cur.hint.textContent=t}

/* ---------- 입력 ---------- */
let held=false;
$('stage').addEventListener('pointerdown',e=>{held=true;if(lanes.length)tap(e)});
addEventListener('pointerup',()=>held=false);addEventListener('pointercancel',()=>held=false);
addEventListener('keydown',e=>{if(!lanes.length)return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!held){held=true;tap(null,e.code==='Enter'&&lanes.length>1?1:0)}}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter')held=false});
document.querySelectorAll('.card[data-g]').forEach(c=>c.addEventListener('click',()=>{audio();pickGame(c.dataset.g)}));
document.querySelectorAll('.card.m').forEach(c=>c.addEventListener('click',()=>{audio();pickMode(c.dataset.m)}));
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=toMenu);
{const cg=$('countGrid');for(let n=2;n<=16;n++){const b=document.createElement('button');b.innerHTML=`${n}<small>명</small>`;b.onclick=()=>nameScreen(n);cg.appendChild(b)}}
$('namesGo').onclick=()=>{audio();const ns=readNames();G.mode==='tour'?makeBracket(ns):startMatch(ns)};
$('brGo').onclick=()=>{audio();const m=T.cur;m?startMatch([T.names[m.a],T.names[m.b]]):showChamp()};
$('brShuffle').onclick=()=>makeBracket(T.names);
$('menuBtn').onclick=()=>G.mode==='tour'&&T?showBracket():toMenu();

/* ---------- 카메라 · 사람 인식 (도토리 게임과 같은 방식) ---------- */
let camOn=false,camBusy=false,lm=null,lastVT=-1;const vid=$('vid');
function camSt(t,ok){const e=$('camSt');e.textContent=t;e.classList.toggle('ok',!!ok)}
async function startCam(){if(camOn||camBusy)return;camBusy=true;$('camBox').hidden=!lanes.length;camSt('카메라 준비 중…');
  try{const st=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});vid.srcObject=st;await vid.play();
    camSt('동작 인식 불러오는 중…');
    const V=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const files=await V.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:d},runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});
    try{lm=await V.PoseLandmarker.createFromOptions(files,o('GPU'))}catch(e){lm=await V.PoseLandmarker.createFromOptions(files,o('CPU'))}
    camOn=true}
  catch(e){console.warn(e);camOn=false;$('useCam').checked=false;$('camBox').hidden=true;$('camNote').textContent='카메라를 쓸 수 없어서 화면 터치로 진행해요.';}
  camBusy=false}
$('useCam').addEventListener('change',e=>{if(e.target.checked)startCam()});
try{if(localStorage.getItem('sportsGuide')==='off')$('useGuide').checked=false}catch(e){}
$('useGuide').addEventListener('change',e=>{try{localStorage.setItem('sportsGuide',e.target.checked?'on':'off')}catch(_){}});
function sense(){if(!camOn||vid.readyState<2||vid.currentTime===lastVT)return;lastVT=vid.currentTime;let res;try{res=lm.detectForVideo(vid,performance.now())}catch(e){return}
  const ps=(res.landmarks||[]).map(l=>({l,w:Math.abs(l[11].x-l[12].x),x:1-(l[11].x+l[12].x)/2}));
  if(lanes.length===1){ps.sort((a,b)=>b.w-a.w);feed(lanes[0].P,ps[0])}
  else{ps.sort((a,b)=>a.x-b.x);let A=null,B=null;if(ps.length>=2){A=ps[0];B=ps[ps.length-1]}else if(ps.length===1){if(ps[0].x<.5)A=ps[0];else B=ps[0]}feed(lanes[0].P,A);feed(lanes[1].P,B)}
  const n=lanes.filter(l=>l.P.found).length;camSt(n?(lanes.length>1?`${n}명 찾았어요`:'찾았어요!'):'카메라 앞에 서 주세요',n>0)}
function feed(P,p){if(!p){P.found=false;P.handUp=P.bothUp=P.low=P.kick=P.full=false;return}const l=p.l;P.x=P.found?P.x+(p.x-P.x)*.3:p.x;P.found=true;
  const up=i=>l[i].visibility>.3&&l[i].y<l[0].y;P.handUp=up(15)||up(16);P.bothUp=up(15)&&up(16);const vis=i=>l[i].visibility>.4;P.low=vis(15)&&vis(16)&&l[15].y>l[11].y&&l[16].y>l[12].y;P.full=vis(27)&&vis(28)&&l[27].y<.98&&l[28].y<.98;
  const leg=Math.abs((l[27].y+l[28].y)/2-(l[23].y+l[24].y)/2)||.3;P.kick=vis(25)&&vis(26)&&Math.abs(l[25].y-l[26].y)>leg*.3;const ln=(l[12].y-l[11].y)/(p.w||.01);P.lean+=(ln-P.lean)*.3}

/* ---------- 소리 ---------- */
let AC=null;function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function noise(dur,freq,vol){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*dur|0,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start()}
let lastHit=0;function hitSound(){const t=performance.now();if(t-lastHit>60){lastHit=t;noise(.25,2600,.5)}}
function tones(l){if(!AC)return;const n=AC.currentTime;l.forEach(([f,t,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,n+t);g.gain.exponentialRampToValueAtTime(.22,n+t+.02);g.gain.exponentialRampToValueAtTime(.0001,n+t+d);o.connect(g).connect(AC.destination);o.start(n+t);o.stop(n+t+d+.05)})}
function cheer(){tones([[523,0,.2],[659,.12,.2],[784,.24,.2],[1047,.36,.4]])}

let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;if(!lanes.length||!M)return;sense();if(!M.started&&!M.guide)readyCheck(dt);
  const w=innerWidth,h=innerHeight,n=lanes.length,vw=w/n;R.setScissorTest(true);
  lanes.forEach((l,i)=>{use(l);update(dt);R.setViewport(i*vw,0,vw,h);R.setScissor(i*vw,0,vw,h);l.cam.aspect=vw/h;l.cam.fov=l.cam.aspect<.9?68:55;l.cam.updateProjectionMatrix();R.render(l.scene,l.cam)})}
requestAnimationFrame(loop);
window.__T={G:()=>G,Tt:()=>T,pickGame,pickMode,startMatch,makeBracket,BP,sim:(x,a)=>{resetPins();resetBall();const b=W.ball,a2=a*.075+(Math.random()-.5)*2*BP.noise;b.x=x;b.vx=Math.sin(a2)*BALL_V;b.vz=-Math.cos(a2)*BALL_V;b.active=true;for(let i=0;i<2400;i++)stepBowl(1/240);return W.pins.filter(p=>p.fallen).length},tap:li=>tap(null,li||0),S:(li=0)=>lanes[li]?lanes[li].S:{phase:'none'},M:()=>M,lanes:()=>lanes,W:()=>W,throwIt:(li=0)=>{use(lanes[li]);throwIt()},pose:(li,o)=>{camOn=true;Object.assign(lanes[li].P,{found:true},o)},SP,cam:(x,h,l=0,both=false,li=0)=>{camOn=true;const P=lanes[li].P;P.found=true;P.x=x;P.handUp=h;P.bothUp=both;P.lean=l}};
}
