<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산타 굴뚝 넘기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1F2A4A;--soft:#4A5A80;--cream:#EEF4FB;--paper:#FFFFFF;--red:#D63A3A;--grn:#2E8B57;--rust:#C8322F}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#141C33;overflow:hidden;font-family:'Jua',sans-serif;color:var(--ink)}
  #stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:top left;overflow:hidden;background:var(--cream)}
  canvas#game{position:absolute;left:0;top:0;width:1280px;height:720px}
  .screen{position:absolute;inset:0;display:none;background:var(--cream);z-index:3}
  .screen.on{display:block}
  button{font-family:'Jua',sans-serif;cursor:pointer}
  .pill{font-size:20px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:8px 18px;min-height:48px}
  .pill.green{color:#fff;background:#2E8B57;border-color:#1F6B40}
  .big{font-size:34px;color:#fff;background:var(--rust);border:4px solid #8E1F1C;border-radius:999px;padding:12px 56px;min-height:64px}
  .big.white{color:var(--ink);background:#fff;border-color:var(--ink)}
  h1{font-weight:400;margin:0}
  p{margin:0}
  #hud{position:absolute;display:none;gap:10px;align-items:center;z-index:5}
  #hud.solo{display:flex;left:40px;top:14px}
  #hud.battle{display:flex;left:40px;bottom:6px}
  #hud label{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:18px;min-height:48px}
  #hud select{font-family:'Jua',sans-serif;font-size:18px;color:var(--ink);background:transparent;border:none}
  .modes{position:absolute;left:0;right:0;top:200px;display:flex;justify-content:center;gap:40px}
  .mode{width:360px;height:380px;padding:24px;background:var(--paper);border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:var(--ink)}
  .mode canvas{width:312px;height:190px;border-radius:24px;display:block}
  .mode .t{font-size:48px;line-height:1}
  .mode .s{font-size:26px;color:var(--soft)}
  .cards{position:absolute;left:0;right:0;top:210px;display:flex;justify-content:center;gap:48px}
  .card{width:470px;border-radius:32px;padding:26px 30px;display:flex;flex-direction:column;gap:14px}
  .card label{display:flex;align-items:center;gap:10px;font-size:32px}
  .card input{font-family:'Jua',sans-serif;font-size:40px;color:var(--ink);background:#fff;border-radius:20px;padding:10px 20px;height:84px;width:100%}
  .card p{font-size:20px;color:var(--soft)}
  #camStatus{position:absolute;left:0;right:0;top:638px;text-align:center;font-size:20px;color:var(--soft)}
  .leafc{position:absolute;border-radius:50%}
  .grass{position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-top:4px solid #C9D9EE}
  .cnt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;position:absolute;left:250px;right:250px;top:200px}
  .cnt button{font-size:46px;height:96px;border-radius:24px;background:var(--paper);border:4px solid var(--rust);color:var(--ink)}
  .cnt button small{font-size:22px}
  .tn{position:absolute;left:60px;right:60px;top:180px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px}
  .tn div{display:flex;align-items:center;gap:8px}
  .tn span{flex:none;width:44px;height:44px;border-radius:50%;background:var(--rust);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
  .tn input{font-family:'Jua',sans-serif;font-size:28px;color:var(--ink);background:#fff;border:3px solid var(--rust);border-radius:16px;padding:6px 14px;height:62px;width:100%;min-width:0}
  #brArea{position:absolute;left:40px;top:120px;width:1200px;height:480px}
  .slot{position:absolute;display:flex;align-items:center;padding:0 12px;border-radius:12px;background:#FFFFFF;border:3px solid #4A5A80;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot.win{border-color:#2F7D32;background:#E5F4E4}
  .slot.lose{opacity:.45}
  .slot.now{border:4px solid #D63A3A;background:#FDE3E3}
  .slot.bye{border-style:dashed;color:#6A7A9A;background:transparent}
  .slot.champ{border:5px solid #B07A12;background:#FFF1C2}
  .opts{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;font-size:24px}
  .opts .grp{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 8px 5px 18px}
  .opts button{font-size:22px;min-height:48px;min-width:64px;padding:4px 16px;border-radius:999px;border:3px solid #C9D9EE;background:#fff;color:var(--ink)}
  .opts button[aria-pressed="true"]{background:var(--rust);border-color:#8E1F1C;color:#fff}
  .resultbtns{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:16px}
  .howto{position:absolute;left:0;right:0;top:600px;display:flex;justify-content:center;gap:14px}
  .howto span{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 18px;font-size:22px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="게임 화면"></canvas>

  <div id="hud">
    <button class="pill" id="btnHome">처음으로</button>
    <button class="pill green" id="btnMusic">음악 켜짐</button>
    <label>민감도
      <select id="sens"><option value="low">낮음</option><option value="normal" selected>보통</option><option value="high">높음</option></select>
    </label>
  </div>

  <!-- 시작 화면 -->
  <section class="screen on" id="scrStart">
    <div class="leafc" style="left:-60px;top:-60px;width:200px;height:200px;background:#D63A3A"></div>
    <div class="leafc" style="left:80px;top:-110px;width:180px;height:180px;background:#F2B33D"></div>
    <div class="leafc" style="right:-50px;top:-70px;width:210px;height:210px;background:#2E8B57"></div>
    <div class="leafc" style="right:110px;top:-120px;width:180px;height:180px;background:#C8322F"></div>
    <div class="grass" style="height:48px"></div>
    <div style="position:absolute;left:0;right:0;top:52px;display:flex;flex-direction:column;align-items:center;gap:4px">
      <h1 style="font-size:66px">산타 굴뚝 넘기</h1>
      <p style="font-size:26px;color:var(--soft)">점프로 굴뚝을 넘고, 앉아서 눈덩이를 피하고, 두 손 들고 점프해서 큰 선물을 받아요!</p>
    </div>
    <div class="modes">
      <button class="mode" id="btnSolo" style="border:5px solid var(--red)"><canvas id="cvSolo" width="624" height="380"></canvas><span class="t">혼자서</span><span class="s">도전하기</span></button>
      <button class="mode" id="btnBattle" style="border:5px solid var(--grn)"><canvas id="cvBattle" width="624" height="380"></canvas><span class="t">둘이서</span><span class="s">대결하기</span></button>
      <button class="mode" id="btnTour" style="border:5px solid #B07A12"><canvas id="cvTour" width="624" height="380"></canvas><span class="t">토너먼트</span><span class="s">우승자 뽑기</span></button>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:12px">
      <button class="pill" id="btnFull">전체 화면</button>
    </div>
  </section>

  <!-- 이름 넣기 -->
  <section class="screen deco" id="scrNames">
    <div style="position:absolute;left:0;right:0;top:60px;display:flex;flex-direction:column;align-items:center;gap:6px">
      <h1 style="font-size:58px" id="namesTitle">이름을 넣어 주세요</h1>
      <p style="font-size:24px;color:var(--soft)">얼굴은 웹캠으로 산타 얼굴에 들어가요. 이름은 점수판과 결과 화면에 나와요.</p>
    </div>
    <div class="cards">
      <div class="card" style="background:#FDE3E3;border:6px solid var(--red)">
        <label for="name0"><canvas class="flw" data-kind="red" width="80" height="80" style="width:40px;height:40px"></canvas><span id="lab0">산타 이름</span></label>
        <input id="name0" type="text" maxlength="8" placeholder="이름을 써 주세요" style="border:4px solid var(--red)">
        <p>비워 두면 '빨간 산타'(으)로 나와요</p>
      </div>
      <div class="card" id="card1" style="background:#E1F3E8;border:6px solid var(--grn)">
        <label for="name1"><canvas class="flw" data-kind="green" width="80" height="80" style="width:40px;height:40px"></canvas>오른쪽 산타 이름</label>
        <input id="name1" type="text" maxlength="8" placeholder="이름을 써 주세요" style="border:4px solid var(--grn)">
        <p>비워 두면 '초록 산타'(으)로 나와요</p>
      </div>
    </div>
    <div class="opts" data-opts="both" style="top:470px"></div>
    <div style="position:absolute;left:0;right:0;top:546px;display:flex;justify-content:center;gap:16px">
      <button class="big white" id="btnBack">뒤로</button>
      <button class="big" id="btnGo">시작!</button>
    </div>
    <p id="camStatus">카메라 준비 중…</p>
  </section>

  <!-- 토너먼트: 인원 -->
  <section class="screen deco" id="scrCount">
    <div style="position:absolute;left:0;right:0;top:60px;display:flex;flex-direction:column;align-items:center;gap:6px">
      <h1 style="font-size:58px">몇 명이 참가하나요?</h1>
      <p style="font-size:24px;color:var(--soft)">2명부터 16명까지 고를 수 있어요. 짝이 안 맞으면 몇 명은 첫 판을 쉬고 바로 올라가요.</p>
    </div>
    <div class="cnt" id="countGrid"></div>
    <div style="position:absolute;left:0;right:0;top:560px;display:flex;justify-content:center"><button class="big white" id="btnCountBack">뒤로</button></div>
  </section>

  <!-- 토너먼트: 이름 -->
  <section class="screen deco" id="scrTNames">
    <div style="position:absolute;left:0;right:0;top:50px;display:flex;flex-direction:column;align-items:center;gap:6px">
      <h1 style="font-size:52px" id="tnTitle">이름을 넣어 주세요</h1>
      <p style="font-size:22px;color:var(--soft)">비워 두면 '산타 1', '산타 2'…로 나와요. 대진표는 자동으로 섞여요.</p>
    </div>
    <div class="tn" id="tnGrid"></div>
    <div class="opts" data-opts="time" style="top:478px"></div>
    <div style="position:absolute;left:0;right:0;top:552px;display:flex;justify-content:center;gap:16px">
      <button class="big white" id="btnTnBack">뒤로</button>
      <button class="big" id="btnMakeBracket">대진표 만들기</button>
    </div>
    <p class="tnCam" style="position:absolute;left:0;right:0;top:638px;text-align:center;font-size:20px;color:var(--soft)"></p>
  </section>

  <!-- 토너먼트: 대진표 -->
  <section class="screen" id="scrBracket">
    <div style="position:absolute;left:0;right:0;top:22px;display:flex;flex-direction:column;align-items:center;gap:2px">
      <h1 style="font-size:46px" id="brTitle">대진표</h1>
      <p style="font-size:22px;color:var(--soft)" id="brSub"></p>
    </div>
    <div id="brArea"></div>
    <div style="position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:16px">
      <button class="pill" id="btnBrHome" style="font-size:22px">처음으로</button>
      <button class="big white" id="btnShuffle" style="font-size:28px;padding:8px 36px">다시 섞기</button>
      <div class="opts" data-opts="tdiff" style="position:static"></div>
      <button class="big" id="btnNextMatch" style="font-size:30px;padding:8px 40px">경기 시작!</button>
    </div>
  </section>

  <!-- 토너먼트: 우승 -->
  <section class="screen deco" id="scrChamp"></section>

  <!-- 결과 -->
  <section class="screen" id="scrResult"></section>
</div>

<video id="video" playsinline muted style="display:none"></video>

<script type="module">
/* ================== 기본 설정 ================== */
const W = 1280, H = 720, GROUND = 650;
const RED = '#D63A3A', GRN = '#2E8B57';
const stage = document.getElementById('stage');
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const video = document.getElementById('video');
let R = 1;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
  R = Math.min(2.5, Math.max(1, s * (devicePixelRatio || 1)));
  cv.width = Math.round(W * R); cv.height = Math.round(H * R);
}
addEventListener('resize', fit); fit();

/* ================== 게임 물리 (세계 단위) ==================
   산타 키(판정): 서 있을 때 110, 앉으면 62
   보통 점프: 최고 약 140, 공중 약 1.27초 (6살·웹캠 지연 고려해 넉넉하게)
   만세 슈퍼점프: 최고 약 220
   굴뚝 높이 40·55·70, 판정 폭은 가운데 40만 → 점프 타이밍 여유 0.5~0.9초
   작은 선물 높이 150(굴뚝 위는 굴뚝높이+85) → 보통 점프로 먹음
   큰 선물 높이 290 → 산타 발이 157 넘게 떠야 함 → 만세로만 먹음
   눈덩이 높이 92 → 앉아 있어야만 피함 */
const GRAV = 700, VJ = 443, VS = 555, SX = 110;
const H_STAND = 110, H_CROUCH = 62, HALF = 12;
const SB_Y = 92, SB_R = 19, SMALL_Y = 150, BIG_Y = 290, CH_W = 80, CH_IN = 20;

/* ================== 그림 ================== */
const P = s => new Path2D(s);
const STAR = P('M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z');
const SUITS = {
  red: { m: '#D63A3A', d: '#A82828', mit: '#2E7D4F', sack: '#2E7D4F' },
  green: { m: '#2E8B57', d: '#1F6B40', mit: '#C8322F', sack: '#C8322F' },
};

function circle(c, x, y, r, fill) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = fill; c.fill(); }
function ellipse(c, x, y, rx, ry, fill, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); c.fillStyle = fill; c.fill(); }
function rrect(c, x, y, w, h, r, fill) { c.beginPath(); c.roundRect(x, y, w, h, r); c.fillStyle = fill; c.fill(); }

function drawStar(c, x, y, size, color, t) {
  const sc = 0.6 + 0.55 * (0.5 + 0.5 * Math.sin(t * 10));
  c.save(); c.translate(x, y); c.scale(sc * size / 24, sc * size / 24); c.translate(-12, -12);
  c.fillStyle = color; c.fill(STAR); c.restore();
}

function defaultFace(c, r) {
  circle(c, 0, 0, r, '#F6C9A8');
  circle(c, -r * 0.35, -r * 0.1, r * 0.11, '#3B2416');
  circle(c, r * 0.35, -r * 0.1, r * 0.11, '#3B2416');
  circle(c, -r * 0.58, r * 0.22, r * 0.14, '#F2A0A0');
  circle(c, r * 0.58, r * 0.22, r * 0.14, '#F2A0A0');
  circle(c, 0, r * 0.12, r * 0.16, '#E8957A');
  c.beginPath(); c.arc(0, r * 0.2, r * 0.32, 0.2 * Math.PI, 0.8 * Math.PI);
  c.strokeStyle = '#3B2416'; c.lineWidth = r * 0.07; c.lineCap = 'round'; c.stroke();
}

/* 산타 모자 아이콘 */
function drawHat(c, x, y, k, suit) {
  const S = SUITS[suit];
  c.save(); c.translate(x, y); c.scale(k, k);
  c.beginPath(); c.moveTo(-14, 6); c.quadraticCurveTo(-6, -18, 12, -16); c.lineTo(18, -8); c.lineTo(14, 6); c.closePath(); c.fillStyle = S.m; c.fill();
  rrect(c, -17, 2, 34, 10, 5, '#FFFFFF');
  circle(c, 19, -9, 5, '#F5C542');
  c.restore();
}

/* 산타: (x, y) = 발 가운데, k = 크기 */
function drawSanta(c, x, y, k, o = {}) {
  const S = SUITS[o.suit || 'red'], t = o.t || 0;
  c.save(); c.translate(x, y); c.scale(k, k);
  if (o.blink && Math.floor(t * 8) % 2 === 0) c.globalAlpha = 0.45;
  if (o.crouch) c.scale(1.12, 0.6);
  const run = o.run || 0;
  ellipse(c, -11, -5 + run, 11, 6, '#3B2416'); ellipse(c, 11, -5 - run, 11, 6, '#3B2416');
  ellipse(c, -27, -48, 15, 19, S.sack);
  c.fillStyle = '#F5C542'; c.beginPath(); c.moveTo(-34, -66); c.lineTo(-20, -66); c.lineTo(-24, -60); c.lineTo(-30, -60); c.fill();
  ellipse(c, 0, -30, 27, 27, S.m);
  c.fillStyle = '#2B1A12'; c.fillRect(-26, -27, 52, 7);
  c.strokeStyle = '#F5C542'; c.lineWidth = 2.5; c.strokeRect(-5, -29, 10, 11);
  if (o.sup) {
    c.strokeStyle = S.m; c.lineWidth = 11; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-18, -44); c.lineTo(-44, -110); c.stroke();
    c.beginPath(); c.moveTo(18, -44); c.lineTo(44, -110); c.stroke();
    circle(c, -46, -116, 7.5, S.mit); circle(c, 46, -116, 7.5, S.mit);
  } else {
    circle(c, -27, -30, 6.5, S.mit); circle(c, 27, -30, 6.5, S.mit);
  }
  // 수염 (얼굴 뒤에서 아래로)
  c.beginPath(); c.moveTo(-31, -76); c.quadraticCurveTo(-34, -42, 0, -34); c.quadraticCurveTo(34, -42, 31, -76); c.closePath(); c.fillStyle = '#FFFFFF'; c.fill();
  circle(c, -22, -44, 8, '#FFFFFF'); circle(c, 22, -44, 8, '#FFFFFF');
  // 얼굴 칸 (웹캠)
  circle(c, 0, -74, 27, '#FFFFFF');
  c.save(); c.beginPath(); c.arc(0, -74, 25, 0, Math.PI * 2); c.clip();
  c.translate(0, -74);
  if (!(o.face && o.face(c, 25))) defaultFace(c, 25);
  c.restore();
  c.beginPath(); c.arc(0, -74, 25.5, 0, Math.PI * 2); c.setLineDash([5, 4]); c.lineWidth = 2; c.strokeStyle = '#D9C7B0'; c.stroke(); c.setLineDash([]);
  // 모자
  c.beginPath(); c.moveTo(-24, -98); c.quadraticCurveTo(-12, -138, 22, -134); c.lineTo(34, -122); c.lineTo(24, -98); c.closePath(); c.fillStyle = S.m; c.fill();
  rrect(c, -29, -104, 58, 13, 6.5, '#FFFFFF');
  circle(c, 35, -122, 6, '#F5C542'); c.fillStyle = '#B8860B'; c.fillRect(33.5, -120, 3, 4);
  c.restore();
  if (o.stun) {
    drawStar(c, x - 40 * k, y - 150 * k, 26 * k, '#FFD23F', t);
    drawStar(c, x + 44 * k, y - 140 * k, 30 * k, '#FFD23F', t + 0.3);
    drawStar(c, x + 4 * k, y - 168 * k, 20 * k, '#FFFFFF', t + 0.6);
  }
}

/* 굴뚝: (x, 0) = 왼쪽 아래, 세계 단위 (위쪽이 음수) */
function drawChimney(c, X, h, t) {
  const w = CH_W, top = -h;
  c.fillStyle = '#C8322F'; c.fillRect(X + 6, top, w - 12, h);
  c.strokeStyle = '#9E2421'; c.lineWidth = 2;
  for (let r = 0; r * 14 < h; r++) {
    const yy = top + r * 14;
    c.beginPath(); c.moveTo(X + 6, yy); c.lineTo(X + w - 6, yy); c.stroke();
    for (let cc = (r % 2 ? 18 : 32); cc < w - 12; cc += 28) { c.beginPath(); c.moveTo(X + 6 + cc, yy); c.lineTo(X + 6 + cc, Math.min(yy + 14, 0)); c.stroke(); }
  }
  rrect(c, X, top - 10, w, 16, 3, '#A12623');
  c.fillStyle = '#FFFFFF';
  for (let i = 0; i <= 5; i++) { c.beginPath(); c.arc(X + 4 + i * (w - 8) / 5, top - 12, 10, 0, Math.PI * 2); c.fill(); }

  }

}
function detect() {
  if (!cam.ready || video.readyState < 2) return;
  if (video.currentTime === cam.lastVideoTime) return;
  cam.lastVideoTime = video.currentTime;
  let res;
  try { res = cam.landmarker.detectForVideo(video, performance.now()); } catch (e) { return; }
  const vw = video.videoWidth, vh = video.videoHeight;
  cam.frame++;
  cam.poses = (res.landmarks || []).map(lm => {
    const ls = lm[11], rs = lm[12], nose = lm[0], lw = lm[15], rw = lm[16];
    const ok = ls.visibility > 0.5 && rs.visibility > 0.5;
    const sx = (ls.x + rs.x) / 2;
    const bodyX = 1 - (ok ? sx : nose.x); // 거울
    const shoulderW = Math.abs(ls.x - rs.x);
    const swPx = Math.max(30, shoulderW * vw);
    const syPx = (ls.y + rs.y) / 2 * vh;
    const headTop = nose.y * vh - swPx * 0.4;
    const hands = lw.visibility > 0.5 && rw.visibility > 0.5 && lw.y * vh < headTop && rw.y * vh < headTop;
    const earD = Math.hypot((lm[7].x - lm[8].x) * vw, (lm[7].y - lm[8].y) * vh);
    const size = Math.max(70, earD * 2.1, shoulderW * vw * 0.75);
    // 기준 높이 = 얼굴(코) 높이, 크기 = 어깨너비 (어깨가 안 잡히면 귀 사이 거리로 대신)
    const faceOk = nose.visibility > 0.5;
    const sc = ok ? swPx : Math.max(30, earD * 2.2);
    return { x: bodyX, w: shoulderW, ok, sy: syPx, sw: swPx, ny: nose.y * vh, sc, faceOk, vh, hands, face: { x: nose.x * vw, y: nose.y * vh - size * 0.06, size } };
  });
}
function faceDrawer(pl) {

    const f = pl.face;

}

/* 장애물·선물 순서표 (둘이서는 두 사람이 똑같은 순서로 나와요) */
function makeSchedule(from, until, diffKey, r) {
  const d = DIFF[diffKey], list = [];
  let t = from;
  while (t < until - 1.2) {
    if (t > from + 2.5 && r() < d.sb) { t += 1.0; list.push({ t, k: 'warn' }); list.push({ t: t + 1.3, k: 'sb' }); t += 0.6; } // 앞 굴뚝 착지 후 앉을 여유
    else list.push({ t, k: 'ch', lv: [40, 55, 70][Math.floor(r() * 3)], gift: r() < 0.55 });
    t += d.gap + r() * d.gr - Math.min(0.4, (t - from) / 150);
  }
  let g = from + 0.6;
  while (g < until - 1) { list.push({ t: g, k: 'g', big: r() < 0.28 }); g += 1.4 + r() * 1.2; }
  return list.sort((a, b) => a.t - b.t);
}

/* 동작 */
function doJump(p, now) {

function addPop(p, wx, wy, txt, color, now) {

}

function readPoses(dt, now) {
  if (!(cam.ready && cam.poses.length)) return;
  const players = G.players;
  if (!G.battle) {
    const best = cam.poses.slice().sort((a, b) => b.w - a.w)[0];
    applyPose(players[0], best, dt, now);
  } else {
    const left = cam.poses.filter(p => p.x < 0.5).sort((a, b) => b.w - a.w)[0];
    const right = cam.poses.filter(p => p.x >= 0.5).sort((a, b) => b.w - a.w)[0];

function applyPose(p, pose, dt, now) {

    p.samples = p.samples.filter(a => now - a.t <= 1500);
    return;
  }
  if (G.phase !== 'play') return;

  const dy = (p.base - ny) / p.sc;                     // + 위로, - 아래로 (몸 크기 배수)
  // 다른 아이로 바뀌는 등 기준에서 아주 멀리 1.5초 넘게 벗어나 있으면 다시 잡기

/* 시작 전 기준점 잡기: 얼굴이 1초 동안 거의 안 움직이면 그 평균 높이를 기준으로 */

    p.calibProg = Math.min(1, run.ms / CALIB_HOLD);
    if (run.ms >= CALIB_HOLD && now - p.faceAt < 300) {
      const part = p.samples.slice(run.from);

function step(now) {

    if (left <= 0) { G.phase = 'play'; G.playStart = now; SFX.go(); }

function spawn(p, ev) {

/* 굴뚝 위 착지: 내려오다가 굴뚝 윗면(조금 아래까지 봐줌)에 닿으면 그 위에 섬 */

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  T.set = { diff: SET.diff, time: SET.time };

function drawBracket() {
  const n = T.n;
  let P2 = 2; while (P2 < n) P2 *= 2;
  const m = P2 / 2, byes = P2 - n;
  const byeSet = new Set(); for (let k = 0; k < byes; k++) byeSet.add(Math.floor(k * m / byes));
  const order = shuffle([...Array(n).keys()]);
  const r0 = []; let q = 0;
  for (let j = 0; j < m; j++) {
    if (byeSet.has(j)) { r0.push(order[q++], -1); } else { r0.push(order[q++], order[q++]); }
  }
  T.P = P2; T.R = Math.log2(P2); T.rounds = [r0]; T.scores = [[]]; T.played = 0; T.champ = null;
  for (let r = 1; r <= T.R; r++) { T.rounds.push(Array(P2 >> r).fill(null)); T.scores.push([]); }
  for (let j = 0; j < m; j++) if (r0[2 * j + 1] === -1) T.rounds[1][j] = r0[2 * j];
}

      if (b === -1 || a === -1) continue;
      num++;

}

  box.innerHTML = '<p style="font-size:40px;color:#8E1F1C">산타 굴뚝 넘기 토너먼트</p><h1 style="font-size:110px;line-height:1;color:#C8322F">우승!</h1>';
  const nmEl = document.createElement('p'); nmEl.style.cssText = 'font-size:72px;line-height:1.1'; nmEl.textContent = c.name;
  const ru = document.createElement('p'); ru.style.cssText = 'font-size:30px;color:#4A5A80;margin-top:12px'; ru.textContent = '준우승: ' + c.runner;
  const all = document.createElement('p'); all.style.cssText = 'font-size:24px;color:#4A5A80'; all.textContent = `${T.n}명 모두 멋지게 했어요! (${T.played}경기)`;
  box.append(nmEl, ru, all); el.appendChild(box);
  const btns = document.createElement('div'); btns.className = 'resultbtns'; btns.style.bottom = '64px';
  const b1 = document.createElement('button'); b1.className = 'big white'; b1.textContent = '대진표 다시 보기'; b1.style.fontSize = '28px'; b1.onclick = showBracket;
  const b2 = document.createElement('button'); b2.className = 'big'; b2.textContent = '새 토너먼트'; b2.style.fontSize = '28px'; b2.onclick = tourCount;
  const b3 = document.createElement('button'); b3.className = 'pill'; b3.textContent = '처음으로'; b3.style.fontSize = '22px'; b3.onclick = goHome;
  btns.append(b3, b1, b2); el.appendChild(btns);
  const t0 = audio().currentTime; [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, t0 + i * 0.15, 0.3, 'square', 0.07));
  show('scrChamp');
}
buildCountGrid();
renderOpts();
document.querySelectorAll('.screen.deco').forEach(sc => $('scrStart').querySelectorAll('.leafc, .grass').forEach(n2 => sc.prepend(n2.cloneNode(true))));
$('btnTour').onclick = () => { audio(); startMusic(); tourCount(); };
$('btnCountBack').onclick = goHome;
$('btnTnBack').onclick = tourCount;
$('btnMakeBracket').onclick = () => { makeBracket(); showBracket(); };
$('btnShuffle').onclick = () => { drawBracket(); showBracket(); };
$('btnNextMatch').onclick = startTourMatch;
$('btnBrHome').onclick = () => {
  const b = $('btnBrHome');
  if (b.dataset.armed) goHome(); else { b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 처음으로'; setTimeout(() => { b.dataset.armed = ''; b.textContent = '처음으로'; }, 3000); }
};

/* ================== 시작 화면 그림 ================== */
function miniScene(c, bg) {
  c.fillStyle = bg; c.fillRect(0, 0, 312, 190);
  c.fillStyle = '#FFFFFF'; c.fillRect(0, 176, 312, 14);
}
function drawMenuArt() {
  const a = document.getElementById('cvSolo').getContext('2d');
  a.setTransform(2, 0, 0, 2, 0, 0); miniScene(a, '#1F2A4A');
  for (let i = 0; i < 14; i++) circle(a, (i * 53) % 312, (i * 37) % 110 + 8, 1.5, '#FFFFFF');
  a.save(); a.translate(0, 177); drawChimney(a, 200, 50, 0); a.restore();
  drawSanta(a, 100, 178, 1.05, { suit: 'red' });
  drawGift(a, 240, 50, true);
  const b = document.getElementById('cvBattle').getContext('2d');
  b.setTransform(2, 0, 0, 2, 0, 0); miniScene(b, '#1F2A4A');
  for (let i = 0; i < 14; i++) circle(b, (i * 53) % 312, (i * 37) % 110 + 8, 1.5, '#FFFFFF');
  drawSanta(b, 82, 178, 0.95, { suit: 'red' });
  drawSanta(b, 228, 178, 0.95, { suit: 'green' });
  const d = document.getElementById('cvTour').getContext('2d');
  d.setTransform(2, 0, 0, 2, 0, 0); miniScene(d, '#1F2A4A');
  for (let i = 0; i < 14; i++) circle(d, (i * 53) % 312, (i * 37) % 110 + 8, 1.5, '#FFFFFF');
  drawSanta(d, 52, 178, 0.75, { suit: 'red' });
  drawSanta(d, 260, 178, 0.75, { suit: 'green' });
  drawTrophy(d, 156, 110, 0.95);
  for (const f of document.querySelectorAll('canvas.flw')) {
    const c = f.getContext('2d'); c.setTransform(2, 0, 0, 2, 0, 0); c.clearRect(0, 0, 40, 40); drawHat(c, 19, 22, 1, f.dataset.kind);
  }
}
document.fonts.load('40px Jua').finally(drawMenuArt);
drawMenuArt();

// 점검용 (개발자 도구에서 확인)
window.__santa = { get G() { return G; }, get T() { return T; }, newGame, startGame, makeSchedule, setMode: m => mode = m, cam, doJump, doSuper, consts: { GRAV, VJ, VS, H_STAND, H_CROUCH, SB_Y, SMALL_Y, BIG_Y } };
