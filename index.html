<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>은우 생일 네컷</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: live camera on the left (big, kid-facing), shots + frame controls on the right; stacks on narrow screens. */
:root{
  --sky:#5EC1F2; --sky-deep:#2A8FD0; --navy:#132B57; --sun:#FFD23F; --cherry:#FF5A5F; --paper:#FFFFFF; --mist:#E6F4FD;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--mist);color:var(--navy);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 12% 18%,rgba(255,210,63,.35) 0 7px,transparent 8px),radial-gradient(circle at 78% 9%,rgba(255,90,95,.3) 0 6px,transparent 7px),radial-gradient(circle at 90% 70%,rgba(94,193,242,.35) 0 9px,transparent 10px),radial-gradient(circle at 30% 88%,rgba(255,210,63,.3) 0 6px,transparent 7px);
  background-size:420px 420px}
.wrap{max-width:1180px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:14px}
.badge{font-family:var(--f-display);font-size:36px;width:60px;height:60px;border-radius:50%;background:var(--cherry);color:var(--paper);display:grid;place-items:center;box-shadow:0 4px 0 #c9393e;position:relative;flex:none}
.badge::before{content:"";position:absolute;top:-14px;left:50%;width:9px;height:14px;margin-left:-4.5px;background:var(--sun);border-radius:50%/60% 60% 40% 40%}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,36px);margin:0;line-height:1.1}
.sub{margin:2px 0 0;font-size:14px;opacity:.8}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.cam{position:relative;border-radius:22px;overflow:hidden;background:var(--navy);aspect-ratio:4/3;max-width:100%;box-shadow:0 6px 0 rgba(19,43,87,.15)}
.stage{position:absolute;inset:0;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;transition:transform .25s}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opts .lab{font-family:var(--f-display);font-size:17px;min-width:44px}
.chip.sm{padding:7px 14px;font-size:16px}
.guide{position:absolute;top:50%;left:50%;width:60%;height:90%;transform:translate(-50%,-50%);border:4px dashed rgba(255,255,255,.7);border-radius:16px;pointer-events:none}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:min(34vw,240px);color:var(--paper);text-shadow:0 6px 0 rgba(19,43,87,.5);pointer-events:none}
.count small{display:block;font-size:.18em;text-align:center;margin-top:-.2em}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
.flash.on{opacity:1;transition:none}
.camMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--paper);padding:24px;font-size:18px}
.shotTag{position:absolute;left:14px;top:14px;background:var(--cherry);color:var(--paper);font-family:var(--f-display);font-size:20px;padding:6px 14px;border-radius:999px}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 8px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.slot{position:relative;aspect-ratio:529/630;max-width:100%;border:3px dashed var(--sky-deep);border-radius:12px;background:var(--paper);cursor:pointer;overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:var(--sky-deep);padding:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.filled{border-style:solid;border-color:var(--navy)}
.slot.now{border-color:var(--cherry);border-style:solid}
.slot .num{position:absolute;left:5px;top:5px;background:var(--navy);color:var(--paper);font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;z-index:1}
.hint{font-size:14px;opacity:.75;margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-family:var(--f-display);font-size:20px;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--paper);color:var(--navy);box-shadow:0 4px 0 rgba(19,43,87,.18)}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.go{background:var(--cherry);color:var(--paper);box-shadow:0 4px 0 #c9393e;font-size:26px;padding:16px 34px}
.btn.ghost{background:transparent;box-shadow:none;text-decoration:underline;font-size:17px;padding:10px 6px}
.chip{display:flex;align-items:center;gap:8px;border:3px solid transparent;border-radius:999px;padding:7px 14px 7px 7px;background:var(--paper);cursor:pointer;font-family:var(--f-display);font-size:16px;color:var(--navy)}
.chip[aria-pressed="true"]{border-color:var(--navy)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(19,43,87,.2)}
.slot:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}
label.lbl{display:block;font-size:14px;margin-bottom:6px}
input[type=text]{width:100%;font-family:var(--f-body);font-size:18px;padding:11px 14px;border-radius:12px;border:2px solid var(--sky-deep);background:var(--paper);color:var(--navy)}
.toast{min-height:1.4em;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(19,43,87,.85);display:flex;align-items:center;justify-content:center;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.modal-in{background:var(--mist);border-radius:20px;padding:18px;max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:480px;width:100%}
.modal-in img{max-height:64vh;width:auto;max-width:100%;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.25);-webkit-touch-callout:default}
.modal-in p{margin:0;text-align:center;font-size:15px}
[hidden]{display:none!important}
/* 세로 화면: 카메라를 화면 가득, 나머지는 아래로 */
@media (orientation:portrait){
  .wrap{max-width:none;height:100vh;height:100dvh}
  .main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
  .camcol{flex:1;min-height:0;display:flex;flex-direction:column}
  .cam{flex:1;min-height:240px;aspect-ratio:auto;background:transparent;box-shadow:none;overflow:visible}
  .stage{inset:auto;top:0;bottom:0;left:50%;transform:translateX(-50%);height:100%;aspect-ratio:529/630;max-width:100%;border-radius:22px;background:var(--navy);box-shadow:0 6px 0 rgba(19,43,87,.15)}
  .guide{display:none}
  .opts{flex-direction:row;flex-wrap:wrap;gap:10px 22px}
  .camcol>.row{margin-top:10px!important}
  .panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 20px;align-items:start}
  .panel>.sec:first-child{grid-row:span 4}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge" aria-hidden="true">6</div>
    <div>
      <h1>은우의 생일 네컷</h1>
      <p class="sub">2026년 11월 3일 · 허은우 여섯 번째 생일</p>
    </div>
  </header>

  <div class="main">
    <div class="camcol">
      <div class="cam" id="cam">
        <div class="stage"><video id="video" playsinline muted autoplay></video></div>
        <div class="guide" aria-hidden="true"></div>
        <div class="flash" id="flash"></div>
        <div class="count" id="count" aria-live="assertive"></div>
        <div class="shotTag" id="shotTag" hidden></div>
        <div class="camMsg" id="camMsg">카메라를 켜는 중이에요…</div>
      </div>
      <div class="opts">
        <div class="row"><span class="lab">필터</span><span class="row" id="filters"></span></div>
        <div class="row"><span class="lab">배율</span><span class="row" id="zooms"></span></div>
      </div>
      <div class="row" style="margin-top:14px;justify-content:center">
        <button class="btn go" id="start" type="button">사진 찍기</button>
      </div>
    </div>

    <div class="panel">
      <section class="sec">
        <h2>찍은 사진</h2>
        <div class="slots" id="slots"></div>
        <p class="hint">"사진 찍기"를 누르면 5초씩 세고 네 장을 자동으로 찍어요. 마음에 안 드는 칸은 눌러서 그 칸만 다시 찍을 수 있어요.</p>
      </section>

      <section class="sec">
        <h2>프레임 고르기</h2>
        <div class="row" id="frames"></div>
      </section>

      <section class="sec">
        <label class="lbl" for="msg">아래 한마디</label>
        <input type="text" id="msg" maxlength="24" value="사랑하는 은우야, 생일 축하해!">
      </section>

      <div class="row">
        <button class="btn" id="done" type="button">네컷 보기</button>
        <button class="btn ghost" id="reset" type="button">처음부터</button>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-in">
    <img id="result" alt="완성된 은우 생일 네컷">
    <div class="row" style="justify-content:center">
      <button class="btn go" id="save" type="button">저장 · 인쇄</button>
      <button class="btn" id="again" type="button">다시 찍기</button>
      <button class="btn" id="close" type="button">닫기</button>
    </div>
    <p id="saveNote">"저장 · 인쇄"를 누르면 공유 창이 떠요. 프린트를 고르고 용지는 엽서(4×6)로 하세요.<br>안 되면 사진을 꾹 눌러 저장하세요.</p>
  </div>
</div>

<canvas id="strip" width="1200" height="1800" hidden></canvas>

<script>
(function(){
  var W=1200,H=1800,PAD=56,GAP=30,HEAD=320,PW=(W-PAD*2-GAP)/2,PH=630, SECONDS=5;
  var cv=document.getElementById('strip'), ctx=cv.getContext('2d');
  var FRAMES=[
    {id:'sky', name:'하늘 파티', bg:'#5EC1F2', ink:'#132B57', a:'#FFD23F', b:'#FF5A5F', c:'#FFFFFF'},
    {id:'cake',name:'노랑 케이크', bg:'#FFD23F', ink:'#3A2410', a:'#FF5A5F', b:'#2A8FD0', c:'#FFFFFF'},
    {id:'dino',name:'초록 공룡', bg:'#7CCB6E', ink:'#173A1B', a:'#FFD23F', b:'#FF7A3D', c:'#FFFFFF'},
    {id:'space',name:'밤하늘 우주', bg:'#1B2150', ink:'#FFFFFF', a:'#FFD23F', b:'#7FD8FF', c:'#FF8FA3'}
  ];
  var frame=FRAMES[0], photos=[null,null,null,null], busy=false;
  var $=function(id){return document.getElementById(id)};
  var video=$('video'), camMsg=$('camMsg'), countEl=$('count'), flash=$('flash'), shotTag=$('shotTag');
  function say(t){$('toast').textContent=t}

  // ---------- camera ----------
  function startCam(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      camMsg.textContent='이 화면에서는 카메라를 쓸 수 없어요. 사파리에서 https 주소로 열어 주세요.';return;
    }
    navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1920},height:{ideal:1440}}})
      .then(function(s){video.srcObject=s;return video.play();})
      .then(function(){camMsg.hidden=true;})
      .catch(function(){camMsg.textContent='카메라를 켜지 못했어요. 카메라 사용을 "허용"으로 바꾸고 새로고침해 주세요.';});
  }
  startCam();
  // 점선 칸 = 실제로 찍히는 범위 (화면 크기·카메라 방향에 맞춰 계산)
  var guide=document.querySelector('.guide');
  function fitGuide(){
    var vw=video.videoWidth, vh=video.videoHeight, box=video.parentNode;
    if(!vw||!vh) return;
    var bw=box.clientWidth, bh=box.clientHeight, sc=Math.max(bw/vw,bh/vh);
    var ar=PW/PH, cw, ch;
    if(vw/vh>ar){ch=vh;cw=vh*ar;}else{cw=vw;ch=vw/ar;}
    guide.style.width=Math.min(cw*sc,bw-4)+'px'; guide.style.height=Math.min(ch*sc,bh-4)+'px';
  }
  video.addEventListener('loadedmetadata',fitGuide); video.addEventListener('resize',fitGuide);
  window.addEventListener('resize',fitGuide); window.addEventListener('orientationchange',function(){setTimeout(fitGuide,400)});
  setInterval(fitGuide,1500);

  // ---------- sound ----------
  var ac=null;
  function beep(freq,dur){
    try{
      if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
      var o=ac.createOscillator(), g=ac.createGain();
      o.frequency.value=freq; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.25,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
      o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }
  function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

  function grab(){
    var vw=video.videoWidth, vh=video.videoHeight;
    var ar=PW/PH, cw, ch;
    if(vw/vh>ar){ch=vh;cw=vh*ar;}else{cw=vw;ch=vw/ar;}
    cw/=zoom; ch/=zoom;
    var sx=(vw-cw)/2, sy=(vh-ch)/2;
    var c=document.createElement('canvas'); c.width=Math.round(cw); c.height=Math.round(ch);
    var g=c.getContext('2d'); g.translate(c.width,0); g.scale(-1,1);
    g.drawImage(video,sx,sy,cw,ch,0,0,c.width,c.height);
    c.src=c.toDataURL('image/jpeg',.85);
    return c;
  }

  function shoot(i){
    markNow(i);
    shotTag.hidden=false; shotTag.textContent=(i+1)+'번째 사진';
    var p=Promise.resolve();
    for(var s=SECONDS;s>=1;s--){(function(s){p=p.then(function(){countEl.textContent=s;beep(660,.15);return wait(1000);});})(s);}
    return p.then(function(){
      countEl.textContent=''; beep(1320,.25);
      flash.classList.add('on'); var c=grab();
      requestAnimationFrame(function(){requestAnimationFrame(function(){flash.classList.remove('on')})});
      photos[i]=c; paintSlot(i); draw();
      return wait(1200);
    });
  }

  function run(list){
    if(busy) return;
    if(!video.videoWidth){say('카메라가 아직 안 켜졌어요.');return;}
    busy=true; $('start').disabled=true; $('done').disabled=true; $('reset').disabled=true;
    var p=Promise.resolve();
    list.forEach(function(i){p=p.then(function(){return shoot(i)})});
    p.then(function(){
      busy=false; shotTag.hidden=true; markNow(-1);
      $('start').disabled=false; $('done').disabled=false; $('reset').disabled=false;
      if(photos.indexOf(null)===-1){say('다 찍었어요!');showResult();}
    });
  }

  $('start').addEventListener('click',function(){
    var empty=[]; photos.forEach(function(p,i){if(!p)empty.push(i)});
    if(!empty.length){photos=[null,null,null,null];for(var i=0;i<4;i++)paintSlot(i);empty=[0,1,2,3];draw();}
    say(''); run(empty);
  });

  // ---------- filters & zoom ----------
  var FILTERS=[
    {id:'none',name:'원본',ops:[]},
    {id:'soft',name:'뽀샤시',ops:[['brightness',1.12],['contrast',.9],['saturate',1.1]]},
    {id:'warm',name:'따뜻하게',ops:[['sepia',.22],['saturate',1.25],['brightness',1.04]]},
    {id:'cool',name:'시원하게',ops:[['hue-rotate',-12],['saturate',1.05],['brightness',1.04]]},
    {id:'mono',name:'흑백',ops:[['saturate',0],['contrast',1.15],['brightness',1.03]]},
    {id:'vint',name:'빈티지',ops:[['sepia',.45],['contrast',1.08],['saturate',.85]]}
  ];
  var filter=FILTERS[0], zoom=1, ZOOMS=[1,1.5,2];
  function cssOf(f){return f.ops.length?f.ops.map(function(o){return o[0]+'('+o[1]+(o[0]==='hue-rotate'?'deg':'')+')'}).join(' '):'none'}
  function mat(o){
    var a=o[1];
    if(o[0]==='saturate') return [.213+.787*a,.715-.715*a,.072-.072*a,.213-.213*a,.715+.285*a,.072-.072*a,.213-.213*a,.715-.715*a,.072+.928*a];
    if(o[0]==='sepia'){var b=1-a;return [.393+.607*b,.769-.769*b,.189-.189*b,.349-.349*b,.686+.314*b,.168-.168*b,.272-.272*b,.534-.534*b,.131+.869*b];}
    if(o[0]==='hue-rotate'){var r=a*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
      return [.213+c*.787-s*.213,.715-c*.715-s*.715,.072-c*.072+s*.928,.213-c*.213+s*.143,.715+c*.285+s*.140,.072-c*.072-s*.283,.213-c*.213-s*.787,.715-c*.715+s*.715,.072+c*.928+s*.072];}
    return null;
  }
  function applyOps(img,ops){
    var d=img.data;
    for(var k=0;k<ops.length;k++){
      var o=ops[k], m=mat(o), a=o[1];
      for(var p=0;p<d.length;p+=4){
        var r=d[p],g=d[p+1],b=d[p+2];
        if(m){var nr=m[0]*r+m[1]*g+m[2]*b,ng=m[3]*r+m[4]*g+m[5]*b,nb=m[6]*r+m[7]*g+m[8]*b;r=nr;g=ng;b=nb;}
        else if(o[0]==='brightness'){r*=a;g*=a;b*=a;}
        else if(o[0]==='contrast'){r=(r-127.5)*a+127.5;g=(g-127.5)*a+127.5;b=(b-127.5)*a+127.5;}
        d[p]=r<0?0:r>255?255:r; d[p+1]=g<0?0:g>255?255:g; d[p+2]=b<0?0:b>255?255:b;
      }
    }
  }
  function filtered(c){
    if(!filter.ops.length) return c;
    c._f=c._f||{};
    if(c._f[filter.id]) return c._f[filter.id];
    var o=document.createElement('canvas'); o.width=c.width; o.height=c.height;
    var g=o.getContext('2d'); g.drawImage(c,0,0);
    var im=g.getImageData(0,0,o.width,o.height); applyOps(im,filter.ops); g.putImageData(im,0,0);
    return (c._f[filter.id]=o);
  }
  function chipRow(el,items,label,isOn,onPick){
    items.forEach(function(it,idx){
      var b=document.createElement('button'); b.type='button'; b.className='chip sm'; b.id=el.id+'-'+idx;
      b.textContent=label(it); b.setAttribute('aria-pressed',isOn(it)?'true':'false');
      b.addEventListener('click',function(){el.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');onPick(it);});
      el.appendChild(b);
    });
  }
  function applyPreview(){video.style.filter=cssOf(filter);video.style.transform='scaleX(-1) scale('+zoom+')';}
  chipRow($('filters'),FILTERS,function(f){return f.name},function(f){return f===filter},function(f){
    filter=f; applyPreview(); for(var i=0;i<4;i++) paintSlot(i); draw();
  });
  chipRow($('zooms'),ZOOMS,function(z){return z+'배'},function(z){return z===zoom},function(z){zoom=z; applyPreview();});

  // ---------- slots ----------
  var slotsEl=$('slots'), slotBtns=[];
  for(var i=0;i<4;i++){(function(i){
    var b=document.createElement('button'); b.type='button'; b.className='slot'; b.id='slot'+i;
    b.setAttribute('aria-label',(i+1)+'번 칸 다시 찍기');
    b.addEventListener('click',function(){ if(!busy) run([i]); });
    slotsEl.appendChild(b); slotBtns.push(b); })(i);}
  function paintSlot(i){
    var b=slotBtns[i];
    b.className='slot'+(photos[i]?' filled':'');
    b.innerHTML='<span class="num">'+(i+1)+'</span>'+(photos[i]?'':'<span>'+(i+1)+'</span>');
    if(photos[i]){var im=document.createElement('img');im.src=photos[i].src;im.alt='';im.style.filter=cssOf(filter);b.appendChild(im);}
  }
  function markNow(n){slotBtns.forEach(function(b,i){b.classList.toggle('now',i===n)})}
  for(i=0;i<4;i++) paintSlot(i);

  // ---------- frames ----------
  var framesEl=$('frames');
  FRAMES.forEach(function(fr){
    var b=document.createElement('button'); b.type='button'; b.className='chip'; b.id='fr-'+fr.id;
    b.setAttribute('aria-pressed',fr===frame?'true':'false');
    b.innerHTML='<span class="sw" style="background:'+fr.bg+'"></span>'+fr.name;
    b.addEventListener('click',function(){frame=fr;framesEl.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');draw();});
    framesEl.appendChild(b);
  });
  var msgEl=$('msg'); msgEl.addEventListener('input',draw);

  // ---------- drawing ----------
  function rng(seed){return function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}}
  function star(x,y,r,col){ctx.beginPath();for(var k=0;k<10;k++){var q=k%2?r*.45:r,an=Math.PI/5*k-Math.PI/2;ctx.lineTo(x+Math.cos(an)*q,y+Math.sin(an)*q);}ctx.closePath();ctx.fillStyle=col;ctx.fill();}
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function drawCover(im,x,y,w,h){
    var iw=im.naturalWidth||im.width, ih=im.naturalHeight||im.height;
    var s=Math.max(w/iw,h/ih), sw=w/s, sh=h/s;
    ctx.save(); rr(x,y,w,h,18); ctx.clip(); ctx.drawImage(im,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h); ctx.restore();
  }
  function draw(){
    var f=frame; ctx.clearRect(0,0,W,H); ctx.fillStyle=f.bg; ctx.fillRect(0,0,W,H);
    var r=rng(1103), cols=[f.a,f.b,f.c];
    for(var n=0;n<70;n++){var x=r()*W,y=r()*H,c=cols[n%3];ctx.save();ctx.translate(x,y);ctx.rotate(r()*Math.PI);ctx.globalAlpha=.85;ctx.fillStyle=c;
      if(n%3===0)ctx.fillRect(-9,-4,18,8);else if(n%3===1){ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();}else star(0,0,9,c);ctx.restore();}
    // 인쇄 여백: 엽서 위아래 절취선 안쪽으로 내용을 줄여서 그림
    var SAFE=80, sc=(H-SAFE*2)/H;
    ctx.save(); ctx.translate((W-W*sc)/2,SAFE); ctx.scale(sc,sc);
    var ccx=W-PAD-120, ccy=185;
    ctx.fillStyle=f.b;ctx.beginPath();ctx.arc(ccx,ccy,115,0,7);ctx.fill();
    ctx.fillStyle=f.c;ctx.font='200px Jua, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('6',ccx,ccy+16);
    ctx.fillRect(ccx-8,34,16,40);ctx.fillStyle=f.a;ctx.beginPath();ctx.ellipse(ccx,20,10,18,0,0,7);ctx.fill();
    ctx.fillStyle=f.ink;ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.font='44px Jua, sans-serif';ctx.fillText('HAPPY BIRTHDAY',PAD,105);
    ctx.font='112px Jua, sans-serif';ctx.fillText('은우 생일',PAD,225);
    // with 친구들 — '은우 생일' 오른쪽에 작게 두 줄
    var tx=PAD+ctx.measureText('은우 생일').width+28, maxw=(ccx-130)-tx;
    var L0='with ', L1='with 조은우, 로운,', L2='다영, 은서, 은채', wfs=34;
    ctx.font=wfs+'px "Gowun Dodum", sans-serif';
    while(wfs>20&&Math.max(ctx.measureText(L1).width,ctx.measureText(L2).width)>maxw){wfs-=1;ctx.font=wfs+'px "Gowun Dodum", sans-serif';}
    ctx.fillText(L1,tx,225-wfs*1.25); ctx.fillText(L2,tx+ctx.measureText(L0).width,225);
    ctx.font='40px "Gowun Dodum", sans-serif';ctx.fillText('여섯 살이 됐어요',PAD,285);
    for(var i=0;i<4;i++){
      var x0=PAD+(i%2)*(PW+GAP), y0=HEAD+Math.floor(i/2)*(PH+GAP);
      ctx.fillStyle=f.c;rr(x0-10,y0-10,PW+20,PH+20,26);ctx.fill();
      if(photos[i]) drawCover(filtered(photos[i]),x0,y0,PW,PH);
      else{ctx.fillStyle='rgba(0,0,0,.08)';rr(x0,y0,PW,PH,18);ctx.fill();}
    }
    var gb=HEAD+2*PH+GAP;
    star(PAD-4,HEAD-4,28,f.a);star(W-PAD+4,gb+4,28,f.a);
    ctx.textAlign='center';ctx.fillStyle=f.ink;
    var fs=56;ctx.font=fs+'px Jua, sans-serif';
    while(fs>30&&ctx.measureText(msgEl.value).width>W-PAD*2-40){fs-=2;ctx.font=fs+'px Jua, sans-serif';}
    ctx.fillText(msgEl.value||' ',W/2,gb+90);
    ctx.font='34px "Gowun Dodum", sans-serif';ctx.fillText('허은우 · 2026. 11. 03',W/2,gb+148);
    for(var k=0;k<6;k++){var side=k<3?-1:1,cx=W/2+side*(260+(k%3)*34),cy=gb+112;
      ctx.fillStyle=k%2?f.b:f.c;ctx.fillRect(cx-6,cy,12,34);ctx.fillStyle=f.a;ctx.beginPath();ctx.ellipse(cx,cy-10,6,10,0,0,7);ctx.fill();}
    ctx.restore();
  }

  // ---------- result / save ----------
  var modal=$('modal'), resImg=$('result'), lastBlob=null;
  function showResult(){
    draw();
    cv.toBlob(function(b){lastBlob=b;resImg.src=URL.createObjectURL(b);modal.hidden=false;},'image/jpeg',.95);
  }
  $('done').addEventListener('click',function(){
    var m=photos.indexOf(null); if(m!==-1){say((m+1)+'번 칸 사진이 아직 없어요.');return;} showResult();
  });
  $('close').addEventListener('click',function(){modal.hidden=true;});
  $('again').addEventListener('click',function(){
    modal.hidden=true; photos=[null,null,null,null]; for(var i=0;i<4;i++)paintSlot(i); draw(); say('새로 찍어요! "사진 찍기"를 눌러 주세요.');
  });
  $('save').addEventListener('click',function(){
    if(!lastBlob) return;
    var t=new Date(), name='은우생일네컷_'+('0'+t.getHours()).slice(-2)+('0'+t.getMinutes()).slice(-2)+('0'+t.getSeconds()).slice(-2)+'.jpg';
    var file=new File([lastBlob],name,{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).catch(function(){});
    } else {
      var a=document.createElement('a'); a.href=URL.createObjectURL(lastBlob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    }
  });

  var armed=false, resetBtn=$('reset');
  resetBtn.addEventListener('click',function(){
    if(!armed){armed=true;resetBtn.textContent='한 번 더 누르면 지워져요';setTimeout(function(){armed=false;resetBtn.textContent='처음부터';},3000);return;}
    armed=false;resetBtn.textContent='처음부터';photos=[null,null,null,null];for(var i=0;i<4;i++)paintSlot(i);draw();say('새로 시작해요!');
  });

  draw();
  if(document.fonts){Promise.all([document.fonts.load('96px Jua'),document.fonts.load('34px "Gowun Dodum"')]).then(draw,draw);}
})();
</script>
</body>
</html>
